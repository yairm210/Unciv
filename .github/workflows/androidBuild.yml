# Verifies the Android module actually builds (debug variant, no signing needed).
# Separate from buildAndTest.yml (which only compiles+checks) and buildAndDeploy.yml
# (which does the full signed release build, only on tag push).

name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - 'build.gradle.kts'
      - 'android/build.gradle.kts'
  pull_request_target:
    paths:
      - 'build.gradle.kts'
      - 'android/build.gradle.kts'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android-build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          cache: 'gradle'
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android debug APK
        run: ./gradlew :android:assembleDebug
