Greetings to you, revered Queen Dido, ruler of the legendary kingdom of Carthage. The great poet Virgil related your great history, how your husband Acerbas was murdered by your own brother, King Pygmalion of Tyre, to steal the treasures of your family that were rightfully yours. But you endured his pressure until you and your compatriots decided to flee and sail for new lands. The gods led you to the shores of North Africa, and with cunning diplomacy, you expanded the territory of your new home, and laid the basis for the future kingdom of Carthage. = Var hälsad, vördade drottning Dido, härskarinna över det legendariska Kartago. Den store poeten Vergilius berättade din historia: hur din make Acerbas mördades av din egen bror, kung Pygmalion av Tyros, som ville stjäla familjens skatter som rätteligen tillhörde dig. Du uthärdade hans förtryck tills du och dina följeslagare beslutade att fly och segla mot nya länder. Gudarna ledde er till Nordafrikas stränder, där du med listig diplomati utvidgade ditt nya hemlands territorium och lade grunden till det framtida kungariket Kartago.
