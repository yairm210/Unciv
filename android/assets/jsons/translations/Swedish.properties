#################### Lines from Global Tutorials ####################

Welcome to Unciv!\nBecause this is a complex game, there are basic tasks to help familiarize you with the game.\nThese are completely optional, and you're welcome to explore the game on your own! = Välkommen till Unciv!\nEftersom detta är ett komplext spel, finns det några enkla uppgifter för att hjälpa dig komma in i spelet.\nDe är helt frivilliga, och du får gärna utforska spelet själv!

Welcome to Unciv! = Välkommen till Unciv!
Because this is a complex game, there are some tutorials to help familiarize you with it. These can be disabled in the Options -> Display menu, but please hang on if you're new here! = Eftersom detta är ett komplext spel finns det övningar som hjälper dig att lära känna det. De kan inaktiveras under Alternativ → Skärm, men ha tålamod med dem om du är ny här!
Your first mission is to found your capital city. This is actually an important task because your capital city will probably be your most prosperous. Many game bonuses apply only to your capital city, and it will be the center of your empire. = Ditt första uppdrag är att grunda din huvudstad. Det är faktiskt en viktig uppgift, eftersom huvudstaden förmodligen blir din mest välmående stad. Många spelbonusar gäller endast huvudstaden, som dessutom blir rikets centrum.
How do you know a city location is appropriate? Luckily, the game has already chosen a good location for you. You can settle in this place, or maybe move a turn to found on a Hill (for Production and defence) or next to a Mountain (to gain access to the Observatory building later on). = Hur vet du om en plats är lämplig för en stad? Lyckligtvis har spelet redan valt en bra plats åt dig. Du kan slå dig ned där eller kanske flytta ett drag för att grunda staden på en kulle, vilket ger produktion och försvar, eller intill ett berg för att senare få tillgång till observatoriet.
You'll likely want more cities later on. For these cities, you must go and find a good place. Looking for and founding on or near Luxury resources is a good rule of thumb. = Du kommer troligen att vilja ha fler städer senare. För dem måste du själv hitta bra platser. En god tumregel är att söka efter och grunda städer på eller nära lyxresurser.
Luxury resources are tiles that have things like Gems, Cotton, or Silk (indicated by a yellow background of the resource icon). These resources make your civilization happy. You should also keep an eye out for resources needed to build units, such as Iron. Cities cannot be built within 3 tiles of existing cities, which is another thing to keep in mind! = Lyxresurser är rutor med till exempel ädelstenar, bomull eller siden och markeras med gul bakgrund bakom resursikonen. De gör din civilisation lycklig. Håll också utkik efter resurser som behövs för att bygga enheter, till exempel järn. Städer kan inte grundas inom tre rutor från befintliga städer, vilket också är viktigt att tänka på!
Cities will house Citizens, which can work tiles up to 3 tiles away from the city. This means you don’t have to settle cities right on or next to good tiles. Let’s say, for example, that you want access to some Iron – but the resource is in a desert area. You don’t have to settle your city in the desert. You can settle a few tiles away in more prosperous lands. Your city will grow and eventually gain access to the resource. You only need to settle right on top of resources if you need them immediately. = I städer bor invånare som kan bearbeta rutor upp till tre rutor från staden. Det innebär att du inte behöver grunda en stad direkt på eller intill bra rutor. Anta till exempel att du vill få tillgång till järn, men att resursen ligger i en öken. Du behöver inte grunda staden i öknen, utan kan slå dig ned några rutor bort på bördigare mark. Staden växer och får så småningom tillgång till resursen. Du behöver bara grunda staden direkt ovanpå en resurs om du behöver den omedelbart.
The first thing coming out of your city depends on the strategy you want to follow, but the 'classic' build order is to build first two Scouts, then a Shrine, and three Settlers, and adopt Tradition, to explore the map quickly (Scouts ignore terrain cost), and to get an early Pantheon (if you're playing with religion enabled). = Vad du bygger först i staden beror på din strategi, men den ”klassiska” byggordningen är först två spejare, sedan en helgedom och tre nybyggare, samtidigt som du antar Tradition. På så sätt utforskar du kartan snabbt, eftersom spejare ignorerar terrängkostnader, och får tidigt en panteon om religion är aktiverad.
But feel free to experiment with your own build orders! = Experimentera gärna med egna byggordningar!

In your first couple of turns, you will have very little options, but as your civilization grows, so do the number of things requiring your attention. = Under dina första drag, kommer du ha få alternativ, men vartefter din civilisation växer, gör även det antal saker som kräver din uppmärksamhet.

Culture and Policies = Kultur och samhällsinriktningar
Each turn, the culture you gain from all your cities is added to your Civilization's culture.\nWhen you have enough culture, you may pick a Social Policy, each one giving you a certain bonus. = Varje drag läggs kulturen du får från alla dina städer till din Civilisations kultur.\nNär du har tillräckligt med kultur, kan du välja en Sammhällspolicy, där var och en ger dig en särskild bonus.
The policies are organized into branches, with each branch providing a bonus ability when all policies in the branch have been adopted. = Policyerna är indelade i grenar, där vare gren ger en bonusförmåga när alla policys i den grenen har anammats.
With each policy adopted, and with each city built,\n  the cost of adopting another policy rises - so choose wisely! = Med varje anammad policy, och med varje byggd stad,\n  ökar kostnaden för att anamma en annan policy - så välj med eftertanke!

City Expansion = Stadsexpansion
Once a city has gathered enough Culture, it will expand into a neighboring tile.\nYou have no control over the tile it will expand into, but tiles with resources and higher yields are prioritized. = När en stad har samlat tillräckligt mycket Kultur, kommer den expandera till en angränsande rua.\nDu kan inte styra vilken ruta den kommer expandera till, men rutor med resurser och högre avkastning prioriteras.
Each additional tile will require more culture, but generally your first cities will eventually expand to a wide tile range. = Varje extra ruta kommer kräva mer kultur, men vanligtvis kommer dina första städer expandera brett.
Although your city will keep expanding forever, your citizens can only work 3 tiles away from city center.\nThis should be taken into account when placing new cities. = Även om dina städer fortsätter expandera i oändlighet, kan dina medborgare bara arbeta 3 rutor från stadskärnan.\nDetta bör beaktas då man planerar nya städer.

Food is the resource fundamental to your Cities', and as a result Nation's, population and health. = Mat är den grundläggande resursen för städernas och därmed nationens befolkning och hälsa.
Every Citizen in each City consumes Food per turn. Any left over is considered Growth and is stored in the City Center. Once enough accumulates, the City Grows and a new Citizen is added. = Varje invånare i en stad förbrukar mat varje drag. Det som blir över räknas som tillväxt och lagras i stadskärnan. När tillräckligt mycket har samlats växer staden och får en ny invånare.
Initially your main source of Food is the City Center itself and working a surrounding tile with a Citizen. You can increase how much is generated by gaining more Citizens to work more tiles, improving the tiles so that they yield more Food, and eventually Buildings and Policies. = Till en början kommer maten främst från själva stadskärnan och från att en invånare bearbetar en omgivande ruta. Du kan öka produktionen genom att få fler invånare som arbetar på fler rutor, förbättra rutorna så att de ger mer mat och så småningom genom byggnader och samhällsinriktningar.
Since a city's number of Citizens, or Population, determines how many tiles a City can work, Food is often the most important Resource. = Eftersom stadens antal invånare, alltså befolkningen, avgör hur många rutor den kan bearbeta är mat ofta den viktigaste resursen.

Production is the resource that lets a City Center build new things. = Produktion är resursen som låter en stadskärna bygga nya saker.
This can be new Buildings that are added to the City Center, or new Units that can go out across the World Map to advance your Nation's goals. = Det kan vara nya byggnader som läggs till i stadskärnan eller nya enheter som kan färdas över världskartan och främja nationens mål.
Everything you can build has a Production Cost. Every turn each City generates a certain amount of Production and puts it towards whatever is at the top of the Build Queue. Once the total cost is collected, the Building or Unit is built! = Allt som kan byggas har en produktionskostnad. Varje drag genererar varje stad en viss mängd produktion och lägger den på det som ligger överst i byggkön. När hela kostnaden har samlats in färdigställs byggnaden eller enheten!
Any excess Production after something is built is overflowed to the next thing the City builds. Up to it's total Production Cost. = Överskottsproduktion efter att något har byggts förs över till det som staden bygger härnäst, högst upp till dess totala produktionskostnad.
Since this determines how quickly you can build more stuff, your Nation's Production Capacity is crucial to it's advancement and survival. = Eftersom detta avgör hur snabbt du kan bygga mer är nationens produktionskapacitet avgörande för dess utveckling och överlevnad.

⍾Science is the resource that unlocks new and exciting Technologies for your Nation. = ⍾Vetenskap är resursen som låser upp nya och spännande teknologier för nationen.
Once you've Founded your Capital, you'll be prompted to Pick a Technology to Research. = När du har grundat huvudstaden ombeds du att välja en teknologi att forska fram.
Every Technology costs an amount of ⍾Science. Every turn the ⍾Science your Nation produces is paid towards Researching your chosen Technology. = Varje teknologi kostar en viss mängd ⍾vetenskap. Varje drag används den ⍾vetenskap som nationen producerar till forskningen om den valda teknologin.
Once a Technology has it's cost fully paid, you unlock the benefits for your Nation! This could be new Units, Buildings, or other advantages. Any surplus will overflow into the next Technology you pick to Research. = När en teknologis kostnad är helt betald låser du upp dess fördelar för nationen! Det kan vara nya enheter, byggnader eller andra fördelar. Eventuellt överskott förs över till nästa teknologi du väljer att forska fram.
Researching a Technology in the next Era will advance you into that Era and trigger a notification to other Nations about how amazing you are! = När du forskar fram en teknologi från nästa epok går du vidare till den epoken och andra nationer får en avisering om hur fantastisk du är!
Since new Technologies tend to give access to better Units, Buildings, and even unlock powerful new Policies, staying ahead of the competition is one of the best ways to secure your Victory! = Eftersom nya teknologier ofta ger tillgång till bättre enheter och byggnader och till och med låser upp mäktiga nya samhällsinriktningar är ett tekniskt försprång ett av de bästa sätten att säkra segern!

Ah Gold. The Universal Medium of Exchange. Everyone loves Gold! They say it can't buy Happiness, but nuclear submarines are almost as good. = Ah, guld. Det universella bytesmedlet. Alla älskar guld! Det sägs att pengar inte kan köpa lycka, men atomubåtar är nästan lika bra.
You can earn more Gold from Tiles, Resources, Improvements, and eventually Buildings, Specialists, and Trade Routes. Ancient Ruins, meeting new City-States, and Pillaging are also great sources of Gold. During a Golden Age every Tile that already yields Gold will yield an additional Gold! = Du kan tjäna mer guld från rutor, resurser och förbättringar och senare från byggnader, specialister och handelsvägar. Forntida ruiner, möten med nya stadsstater och plundring är också utmärkta guldkällor. Under en guldålder ger varje ruta som redan producerar guld ytterligare ett guld!
Gold is how you pay for Building Maintenance, Transportation Upkeep, and Unit Upkeep. If you run out of Gold, first you'll receive penalties to your ⍾Science production, then eventually your Units will start Disbanding as you can't pay their upkeep. = Guld används för att betala byggnadsunderhåll, transportunderhåll och enhetsunderhåll. Om guldet tar slut får du först avdrag på produktionen av ⍾vetenskap, och så småningom börjar enheter upplösas eftersom du inte kan betala deras underhåll.
Gold can be used to Buy Buildings and Units, helping bring up a new City or quickly build an Army. It can also buy Tiles to add to your City. It's also used to Upgrade your units from their older, obsolete forms to new, stronger versions. And investing it into a Research Agreement is a great way to convert it into ⍾Science. = Guld kan användas för att köpa byggnader och enheter, vilket hjälper en ny stad att komma i gång eller snabbt bygger upp en armé. Det kan också köpa rutor som läggs till staden. Dessutom används guld för att uppgradera äldre, föråldrade enheter till nya och starkare versioner. En investering i ett forskningsavtal är också ett utmärkt sätt att omvandla guld till ⍾vetenskap.
Gold is also very valuable in Diplomacy. You can directly Gift Gold to City-States to gain their favor. Use it to balance a Trade Deal with other Nations. Or demand every last drop after a successful war and your enemy sues for peace. = Guld är dessutom mycket värdefullt i diplomatin. Du kan skänka guld direkt till stadsstater för att vinna deras gunst, använda det för att balansera ett handelsavtal med andra nationer eller kräva varenda slant när en besegrad fiende ber om fred.
Ironically, some may consider Gold to be one of the less important Resources. But it's flexible nature and importance to keep your Nation running makes it a precious thing to pay attention to. After all, everyone loves Gold. = Ironiskt nog betraktar vissa guld som en av de mindre viktiga resurserna. Men dess flexibilitet och betydelse för att hålla nationen igång gör det till något värdefullt att bevaka. Alla älskar trots allt guld.
Not to be confused with the Resource of the same name, Gold Ore = Förväxla inte detta med resursen med samma namn: guldmalm
Trade Route = Handelsväg
See also: [param] = Se även: [param]
Research Agreements = Forskningsavtal

As cities grow in size and influence, you have to deal with a happiness mechanic that is no longer tied to each individual city.\nInstead, your entire empire shares the same level of satisfaction.\nAs your cities grow in population you’ll find that it is more and more difficult to keep your empire happy. = Allteftersom städerna växer i storlek och inflytande, kommer du behöva handskas med en lycklighetsfunktion som inte längre är knuten till varje enskild stad.\nIstället, delar hela ditt rike på samma nivå av nöjdhet.\nAllteftersom dina städer växer i befolkning kommer du märka att det blir svårare och svårare att hålla riket lyckligt.
In addition, you can’t even build any city improvements that increase happiness until you’ve done the appropriate research.\nIf your empire’s happiness ever goes below zero the growth rate of your cities will be hurt.\nIf your empire becomes severely unhappy (as indicated by the smiley-face icon at the top of the interface)\n  your armies will have a big penalty slapped on to their overall combat effectiveness. = Dessutom så kan du inte ens bygga några byggnader som ökar lycklighet tills du gjort motsvarande forskning.\nOm ditt rikes lycklighet någonsin går under noll som kommer tillväxten av dina städer skadas.\nOm ditt rike blir allvarligt olyckligt (vilket visas av glada gubbikonen högst upp i gränssnittet)\n så kommer dina arméer få sin stridseffektivitet allvarligt minskad.
This means that it is very difficult to expand quickly in Unciv.\nIt isn’t impossible, but as a new player you probably shouldn't do it.\nSo what should you do? Chill out, scout, and improve the land that you do have by building Workers.\nOnly build new cities once you have found a spot that you believe is appropriate. = Detta innebär att det är mycket svårt att expandera fort i Unciv.\nDet är inte omöjligt, men som ny spelare bör du inte göra det.\nSå vad göra? Ta det lugnt, utforska, och förbättra det land du har genom att bygga Arbetare.\nBygg bara nya städer när du hittat en plats som du tror passar bra.

Unhappiness = Missnöje
It seems that your citizens are unhappy!\nWhile unhappy, your civilization will suffer many detrimental effects, increasing in severity as unhappiness gets higher. = Det verkar som att dina invånare är olyckliga!\nMedan de är olyckliga kommer din civilisation lida många skadliga effekter, vilka ökar i allvarlighetsgrad varefter olyckligheten ökar.
Unhappiness has two main causes: Population and cities.\n  Each city causes 3 unhappiness, and each population, 1 = Olycklighet har två huvudorsaker: Befolkning och städer.\n  Varje stad orsakar 3 olycklighet, och varje befolkning, 1
There are 2 main ways to combat unhappiness:\n  by building happiness buildings for your population\n  or by having improved luxury resources within your borders. = Det finns två huvudsakliga sätt att bekämpa olycklighet:\n  genom att bygga lyckobyggnader till din befolkning\n  eller genom att ha förbättrade lyxresurser inom dina gränser.

You have entered a Golden Age!\nGolden age points are accumulated each turn by the total happiness \n  of your civilization\nWhen in a golden age, culture and production generation increases +20%,\n  and every tile already providing at least one gold will provide an extra gold. = Du har gått in i en Guldålder!\nGuldålderpoäng ackumuleras varje drag från den totala lyckan \n  i din civilisation\nMedan du är i en guldålder, ökar kultur och produktionsgenerationen med +20%,\n  och alla rutor som redan producerar åtminstone ett guld kommer producer ett extra guld.

Roads and Railroads = Vägar och Järnvägar
Roads reduce the Movement Points required to move between two tiles connected by Roads. = Vägar minskar antalet förflyttningspoäng som krävs för att färdas mellan två rutor som är anslutna med vägar.
Railroads improve this reduction even more! = Järnvägar minskar kostnaden ännu mer!
This greatly improves the speed you can get Units around the map. = Det gör att du kan förflytta enheter över kartan mycket snabbare.
Until you research the technology that removes it, Roads do not cross Rivers = Innan du forskar fram teknologin som tar bort begränsningen kan vägar inte korsa floder.
Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. = Om du ansluter städerna till huvudstaden med vägar och/eller järnvägar genererar handelsvägen guld.
However, since each Road and Railroad have a Maintenance Cost, it may be more economical to wait until the cities grow and only place where needed. = Eftersom varje väg och järnväg har en underhållskostnad kan det dock vara mer ekonomiskt att vänta tills städerna växer och endast bygga där det behövs.

Connecting your cities to the capital by Roads and/or Railroads will generate Gold via the Trade Route. You earn more Gold the more Population the City and your Capital has. = Om du ansluter städerna till huvudstaden med vägar och/eller järnvägar genererar handelsvägen guld. Ju större befolkning staden och huvudstaden har, desto mer guld tjänar du.
Note that each road costs 1 Gold Maintenance per turn, and each Railroad costs 2 Gold, so it may be more economical to wait until the cities grow! = Observera att varje väg kostar 1 guld i underhåll per drag och varje järnväg 2 guld, så det kan vara mer ekonomiskt att vänta tills städerna växer!
Railroads connecting a city to the Capital also provide a 25% Production Boost to the City, but not the Capital. = Järnvägar som ansluter en stad till huvudstaden ger dessutom staden, men inte huvudstaden, 25 % mer produktion.
Trade Routes are also connected over Water via certain buildings like the Harbor. As long as there is a chain that can reach the Capital, there's a Trade Route. Look for this symbol in Yellow below the City Name to mean you have an active Trade Route to your Capital. = Handelsvägar kan också gå över vatten via vissa byggnader, till exempel hamnen. Så länge det finns en sammanhängande förbindelse till huvudstaden finns en handelsväg. Den gula symbolen under stadens namn visar att du har en aktiv handelsväg till huvudstaden.
Trade Routes can get broken either by Blockades or by Removing/Pillaging the connecting Road/Railroad chain. = Handelsvägar kan brytas genom blockader eller genom att den sammanbindande väg- eller järnvägskedjan tas bort eller plundras.
City Blockade = Stadsblockad

Once you’ve settled 3-4 cities and build universities, you’re probably already 100 to 150 turns into the game.\nNow is a good time to start thinking about how, exactly, you want to win – if you haven’t already. = När du har grundat tre eller fyra städer och byggt universitet har du förmodligen redan spelat 100–150 drag.\nNu är det lämpligt att börja fundera på exakt hur du vill vinna, om du inte redan har gjort det.
There are four ways to win in Unciv. They are:\n - Cultural Victory: Complete 5 Social Policy Trees and build the Utopia Project\n - Domination Victory: Conquer the original capital of all other Major civs\n - Science Victory: Be the first to construct a Spaceship\n - Diplomatic Victory: Build the United Nations and win the vote = Det finns fyra sätt att vinna i Unciv:\n – Kulturell seger: Slutför fem träd med samhällsinriktningar och bygg Utopiprojektet\n – Dominansseger: Erövra alla andra stora civilisationers ursprungliga huvudstäder\n – Vetenskaplig seger: Bli först med att färdigställa ett rymdskepp\n – Diplomatisk seger: Bygg Förenta nationerna och vinn omröstningen
So to sum it up, these are the basics of Unciv – Found a prosperous first city, expand slowly to manage happiness, and set yourself up for the victory condition you wish to pursue.\nObviously, there is much more to it than that, but it is important not to jump into the deep end before you know how to swim. = Så summa summarum, detta är grunden i Unciv - Bygg en välmående första stad, expandera långsamt för att hålla steg med olycklighet, och förbered för det segervillkor som du vill arbeta mot.\nDet finns förstås mer att orda om än så, men det är viktigt att inte hoppa i den djupa ändan bassängen innan du kan simma.

Enemy City = Fiendestad
Cities can be conquered by reducing their health to 1, and entering the city with a melee unit.\nSince cities heal each turn, it is best to attack with ranged units and use your melee units to defend them until the city has been defeated! = Städer kan erövras genom att reducera deras hälsa till 1, och gå in i staden med en närstridsenhet.\nEftersom städer läker varje drag, är det bäst att anfalla med räckviddsenheter och använda dina närstridsenheter för att försvara dem tills staden besegrats!

Luxury Resource = Lyxresurs
Luxury resources within your domain and with their specific improvement are connected to your trade network.\nEach unique Luxury resource you have adds 5 happiness to your civilization, but extra resources of the same type don't add anything, so use them for trading with other civilizations! = Lyxresurser inom dina gränser som har sin motsvarande förbättring sammankopplas till ditt handelsnätverk.\nVarje sorts Lyxresurs du har lägger till 5 lycka till din civilisation, men extra resurser av samma sort ger inget extra, så du kan använda dem för att handla med andra civilisationer!

Strategic Resource = Strategisk resurs
Strategic resources within your domain and with their specific improvement are connected to your trade network.\nStrategic resources allow you to train units and construct buildings that require those specific resources, for example the Horseman requires Horses. = Strategiska resurser inom dina gränser som har sin motsvarande förbättring sammankopplas till ditt handelsnätverk.\nStrategiska resurser låter dig träna enheter och bygga byggnader som kräver dessa resurser, till exempel kräver Ryttare Hästar.
Unlike Luxury Resources, each Strategic Resource on the map provides more than one of that resource.\nThe top bar keeps count of how many unused strategic resources you own.\nA full drilldown of resources is available in the Resources tab in the Overview screen. = Till skillnad från Lyxresurser, ger varje Strategisk Resurs på kartan mer än en av den resursen.\nDen översta raden håller koll på hur många outnyttjade strategiska resurser du har.\nDetaljerad information om resurser finns i Resursfliken i Översiktsskärmen.

The city can no longer put up any resistance!\nHowever, to conquer it, you must enter the city with a melee unit = Staden kan inte längre erbjuda motstånd!\nMen för att erövra den, måste du gå in i staden med en närstridsenhet

After Conquering = Efter erövringen
When conquering a city, you can choose to liberate, annex, puppet, or raze the city. = När du erövrar en stad kan du välja att befria, annektera, göra den till en lydstad eller ödelägga den.
\nLiberating the city will return it to its original owner, giving you a massive diplomatic boost with them!\n\nAnnexing the city will give you full control over it, but also increase the citizens' unhappiness to 2x!\nThis can be mitigated by building a courthouse in the city, returning the citizen's unhappiness to normal.\n\nPuppeting the city will mean that you have no control on the city's production.\nThe city will not increase your tech or policy cost.\nA puppeted city can be annexed at any time, but annexed cities cannot be returned to a puppeted state!\n\nRazing the city will lower its population by 1 each turn until the city is destroyed!\nYou cannot raze a city that is either the starting capital of a civilization or the holy city of a religion. = \nAtt befria staden ger tillbaka den till dess ursprungliga ägare, vilket ger dig ett enormt diplomatisk tillskott med dem!\n\nGenom att annektera staden får du full kontroll över den, men det ökar även invånarnas olycklighet till 2x!\nDetta kan minskas genom att bygga en domstol i staden, vilket återställer invånarnas olycklighet til normal nivå.\n\nAtt göra marionett av staden innebär att du inte har någon kontroll över stadens produktion.\nStaden kommer inte öka kostnaden för dina teknologier eller policyer.\nEn marionettstad kan närsomhelst annekteras, men annekterade städer kan inte återgå till marionettillstånd!\n\nAtt jämna staden med marken kommer minska dess befolkning med 1 varje drag tills staden är förstörd!\nDu kan inte jämna en stad med marken som är en civilisations första huvudstad eller en religions heliga stad.

You have encountered a barbarian unit!\nBarbarians attack everyone indiscriminately, so don't let your \n  civilian units go near them, and be careful of your scout! = Du har mött en barbarenhet!\nBarbarer anfaller alla utan urskilling, så låt inte dina \n civila enheter komma nära dem, och var försiktig med din spejare!

You have encountered another civilization!\nOther civilizations start out peaceful, and you can trade with them,\n  but they may choose to declare war on you later on = Du har mött en annan civilisation!\nAndra civilisationer börjar fredliga, och du kan handla med dem,\n men de kan välja att förklara krig mot dig senare

Injured Units = Skadade enheter
Injured units deal less damage, but recover after turns that they have been inactive.\nUnits heal 10 health per turn in enemy territory or neutral land,\n  20 inside your territory and 25 in your cities. = Skadade enheter gör mindre skada, men återhämtar sig efter inaktiva drag.\nEnheter läger 10 liv per drag i fientligt eller neutralt territorium,\n 20 i ditt territorium och 25 i dina städer.

Workers = Arbetare
Workers are vital to your cities' growth, since only they can construct improvements on tiles.\nImprovements raise the yield of your tiles, allowing your city to produce more and grow faster while working the same amount of tiles! = Arbetare är nödvändiga för dina städers tillväxt, eftersom de är de enda som kan bygga förbättringar på rutor.\nFörbättringar ökar avkastningen från dina rutor, vilket låter din stad producera mer och växa snabbar medan den arbetar samma mängd rutor!

Embarking = Embarkering
Once a certain tech is researched, your land units can embark, allowing them to traverse water tiles.\nEntering or leaving water takes the entire turn. = När en viss teknologi upptäckts kan dina landenheter stiga ombord, vilket låter dem färdas över vattenrutor.\nAtt gå in i eller lämna vattenrutor tar hela draget.
Units are defenseless while embarked (cannot use modifiers), and have a fixed Defending Strength based on your tech Era, so be careful!\nRanged Units can't attack, Melee Units have a Strength penalty, and all have limited vision. = Enheter är försvarslösa medan de är ombordstigna (kan inte använda bonusar), och har en fix Försvarsstyrka som beror på din teknologiska Era, så se upp!\nRäckviddsenheter kan inte anfalla, Närstridsenheter har ett styrkeavdrag, och alla har begränsad sikt.

Idle Units = Overksamma enheter
Clicking 'Next unit' moves to the next idle unit in the queue (as listed in Overview -> Units). After issuing an order to an unit, if 'Auto Unit Cycle' in Options -> Gameplay is enabled, you will automatically select the next idle unit. = När du klickar på ”Nästa enhet” går du till nästa overksamma enhet i kön, enligt Översikt → Enheter. När du har gett en enhet en order väljs nästa overksamma enhet automatiskt om ”Växla automatiskt mellan enheter” är aktiverat under Alternativ → Spelupplägg.
If you don't want to move a unit this turn, you can skip it by clicking 'Next unit' again, or command the unit to 'Skip turn'. = Om du inte vill flytta en enhet under det här draget kan du hoppa över den genom att klicka på ”Nästa enhet” igen eller ge enheten ordern ”Hoppa över drag”.
If you want to disable the 'Next unit' feature entirely, you can toggle it in Options -> Gameplay -> Check for idle units. = Du kan inaktivera funktionen ”Nästa enhet” helt under Alternativ → Spelupplägg → Kontrollera overksamma enheter.
If you'd rather 'Next unit' cycle the units and not mark them as Done, you can change it in the Options -> Gameplay menu. = Om du hellre vill att ”Nästa enhet” växlar mellan enheterna utan att markera dem som klara kan du ändra detta under Alternativ → Spelupplägg.
You can also cycle through the idle units using the left and right triangles on the Unit Table in the lower left of the screen. Or by default using the Cycle button next to the 'Next Unit' button. = Du kan också växla mellan overksamma enheter med vänster- och högertrianglarna i enhetstabellen nere till vänster på skärmen eller, som standard, med växlingsknappen intill ”Nästa enhet”.

Contact Me = Kontakta mig
Hi there! If you've played this far, you've probably seen that the game is currently incomplete.\n Unciv is meant to be open-source and free, forever.\n That means no ads or any other nonsense. = Hej! Om du spelat så här långt, har du förmodligen märkt att spelet för närvarande är ofärdigt.\n Unciv är tänkt att vara öppen källkod, och gratis, för alltid.\n Det innebär att det finns ingen reklam eller annat nonsens.
What motivates me to keep working on it, \n  besides the fact I think it's amazingly cool that I can,\n  is the support from the players - you guys are the best! = Det som motiverar mig att fortsätta arbeta på det, \n förutom det faktum att jag tycker det är otrooligt häftigt at jag kan,\n  är stödet från spelarna - ni är bäst!
Every rating and review that I get puts a smile on my face =)\n  So contact me! Send me an email, review, Github issue\n  or mail pigeon, and let's figure out how to make the game \n  even more awesome!\n(Contact info is in the Play Store) = Varje betyg och recension får mig att le =)\n  Kontakta mig! Skicka ett e-postmeddelande, en recension, ett Github-ärende\n  eller en brevduva, så funderar vi tillsammans på hur spelet kan bli\n  ännu bättre!\n(Kontaktuppgifterna finns i Play Store)

Pillaging = Plundring
Military units can pillage improvements, which heals them 25 health and ruins the improvement.\nThe tile can still be worked, but advantages from the improvement - stat bonuses and resources - will be lost.\nWorkers can repair these improvements, which takes less time than building the improvement from scratch.\nPillaging certain improvements will result in your units looting gold from the improvement. = Militära enheter kan plundra förbättringar, vilket läker dem med 25 liv och förstör förbättringen.\nRutan kan fortfarande arbetas på, men fördelar från förbättringen - bonusar och resurser - kommer gå förlorade.\nArbetare kan laga förbättringarna, vilket tar mindre tid än att bygga förbättringen från grunden.\nNär du plundrar vissa förbättringar kommer dina enhter plundra guld från förbättringen.

Experience = Erfarenhet
Units that enter combat gain experience, which can then be used on promotions for that unit.\nUnits gain more experience when in Melee combat than Ranged, and more when attacking than when defending. = Enheter som går in i strid får erfarenhet, vilket sedan kan användas för befordringar för enheten.\nEnheter får mer erfarenhet i Närstrid än Räckvidd, och mer då de anfaller än då de försvarar.
Units can only gain up to 30 XP from Barbarian units - meaning up to 2 promotions. After that, Barbarian units will provide no experience. = Enheter kan bara tjäna upp till 30 EP från Barbarenheter - dvs upp till 2 befordringar. Därefter kommer Barbarenheter inte ge någon erfarenhet.

Combat = Strid
Unit and cities are worn down by combat, which is affected by a number of different values.\nEach unit has a certain 'base' combat value, which can be improved by certain conditions, promotions and locations. = Enheter och städer nöts ned av strid, vilket påverkas av ett antal olika värden.\nVarje enhet har ett visst 'grund'-stridsvärde, vilket kan förbättras av vissa tillstånd, befordringar, och platser.
Units use the 'Strength' value as the base combat value when melee attacking and when defending.\nWhen using a ranged attack, they will the use the 'Ranged Strength' value instead. = Enhter använder 'Styrka'-värdet som grundstridsvärdet i närstrid.\nNär de gör en räckviddsattack kommer de använda 'Räckviddsstyrka'-värdet istället.
Ranged attacks can be done from a distance, dependent on the 'Range' value of the unit.\nWhile melee attacks allow the defender to damage the attacker in retaliation, ranged attacks do not. = Räckviddsattacker kan göras från avstånd, beroende på enhetens 'Räckvidd'.\nMedan närstridsattacker låter försvararen skada anfallaren i gengäld, låter räckviddsattacker inte detta ske.

Embassies = Ambassader
Establishing an embassy in other players' Capital city shows the location of their Capital, likewise other players who establish an embassy in your Capital can see location of your Capital. = En ambassad i en annan spelares huvudstad visar var huvudstaden ligger. På motsvarande sätt kan andra spelare som upprättar en ambassad i din huvudstad se var den ligger.
Embassies thus allow Spies to be placed in another players' Capital City if Espionage is enabled. = Ambassader gör det dessutom möjligt att placera spioner i en annan spelares huvudstad om spioneri är aktiverat.
Mutual embassies are required to allow trading open borders and to sign Research Agreement and Defensive Pact. = Ömsesidiga ambassader krävs för att kunna handla med öppna gränser och underteckna forskningsavtal och försvarspakter.
Declaring war on another player or denouncing them will remove embassies from both players' Capitals. You will have to re-establish them to use their effect. = Om du förklarar krig mot eller fördömer en annan spelare tas ambassaderna bort från båda spelarnas huvudstäder. De måste upprättas på nytt för att deras effekt ska kunna användas.
Re-establishing an embassy after denunciation from either side becomes available next turn, while re-establishing them when at war requires a peace treaty. = Efter en fördömelse från någondera sidan kan en ambassad återupprättas nästa drag. Under krig krävs däremot ett fredsavtal.
Be cautious when accepting embassy from other players because they can spy on your capital, or worse may start planning to attack you. = Var försiktig när du accepterar en annan spelares ambassad, eftersom spelaren kan spionera på din huvudstad eller, ännu värre, börja planera ett anfall mot dig.
Note that before you can offer an embassy, you need the required Technology. = Observera att du måste ha den nödvändiga teknologin innan du kan erbjuda en ambassad.
Embassies are available using the Gods and Kings ruleset. = Ambassader är tillgängliga med regelverket Gods and Kings.
Defensive Pacts = Försvarspakter

Open Borders from other player and vice versa allow units to freely pass through their territory. = Öppna gränser från en annan spelare, och omvänt, låter enheter färdas fritt genom den spelarens territorium.
They also let Missionaries to enter other players' territory without suffering attrition. = De låter också missionärer gå in på andra spelares territorium utan att ta skada av förslitning.
Open Borders expire depending on game speed and are canceled upon Declaration of War, the closure however takes effect only after war ends and need to be traded again. = Öppna gränser upphör efter en tid som beror på spelhastigheten och annulleras vid en krigsförklaring. Stängningen träder dock i kraft först när kriget är slut, och avtalet måste därefter handlas fram på nytt.
You gain diplomatic boost with other AI player if you both have Open Borders to each other = Du får en diplomatisk bonus med en annan AI-spelare om ni båda har öppna gränser gentemot varandra.
Be cautious when giving Open Borders because other player may settle a City near your lands in an area you are planning to use, they may also use your territory to attack your friends or City State allies. = Var försiktig när du beviljar öppna gränser, eftersom den andra spelaren kan grunda en stad nära ditt land på ett område du tänkt använda eller utnyttja ditt territorium för att anfalla dina vänner eller allierade stadsstater.
Note that before you can offer or accept open borders, both Nations need the required Technology. = Observera att båda nationerna behöver den nödvändiga teknologin innan öppna gränser kan erbjudas eller accepteras.
When playing with the Gods and Kings ruleset mutual embassies need to be established before Open Borders can be traded. = Med regelverket Gods and Kings måste ömsesidiga ambassader upprättas innan öppna gränser kan handlas.

In Research Agreements, you and another civilization decide to jointly research technology.\nAt the end of the agreement, you will both receive a 'lump sum' of ⍾Science, which will go towards one of your unresearched technologies. = I ett forskningsavtal beslutar du och en annan civilisation att forska gemensamt.\nNär avtalet löper ut får båda en engångssumma ⍾vetenskap som används till en av de ännu outforskade teknologierna.
The amount of ⍾Science you receive at the end is dependent on the ⍾Science generated by your cities and the other civilization's cities during the agreement - the more, the better! = Mängden Vetenskap du får på slutet beror på vetenskapen som genererats av dina städer och den andra civilisationens städer under avtalet - ju mer, desto bättre!
Note that before you can invest in a research agreement, you must have a Declaraction of Friendship, both Nations need the required Technology, and both Nations need enough Gold on hand for the agreement. = Observera att du måste ha en vänskapsförklaring innan du kan investera i ett forskningsavtal. Båda nationerna behöver dessutom den nödvändiga teknologin och tillräckligt med guld för avtalet.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Research Agreement can be signed. = Med regelverket Gods and Kings måste ömsesidiga ambassader upprättas innan ett forskningsavtal kan undertecknas.

Defensive pacts allow you and another civ to protect one another from aggressors.\nOnce the defensive pact is signed, you will be drawn into their future defensive wars, just as they will be drawn into your future defensive wars. Declaring war on any Civ will remove all of your defensive pacts. You will have to re-sign them to use their effect. = Försvarspakter låter dig och en annan civilisation skydda varandra mot angripare.\nNär pakten har undertecknats dras du in i den andra partens framtida försvarskrig, precis som den dras in i dina. Om du förklarar krig mot någon civilisation upphävs alla dina försvarspakter. Du måste underteckna dem på nytt för att återfå deras effekt.
Be cautious when signing defensive pacts because they can bring you into wars that you might not want to be in. = Var försiktig när du undertecknar försvarspakter, eftersom de kan dra in dig i krig som du inte vill delta i.
The AI is very careful and will not accept defensive pacts with less than 80 influence. = AI:n är mycket försiktig och accepterar inte en försvarspakt vid mindre än 80 inflytande.
Note that before you can sign a defensive pact, you must have a Declaraction of Friendship, and both Nations need the required Technology. = Observera att du måste ha en vänskapsförklaring innan du kan underteckna en försvarspakt, och båda nationerna behöver den nödvändiga teknologin.
When playing with the Gods and Kings ruleset mutual embassies need to be established before a Defensive Pact can be signed. = Med regelverket Gods and Kings måste ömsesidiga ambassader upprättas innan en försvarspakt kan undertecknas.

Not all nations are contending with you for victory.\nCity-States are nations that can't win, can't be traded with, and instead confer certain bonuses to friendly civilizations. = Alla nationer konkurrerar inte med dig om segern.\nStadsstater är nationer som inte kan vinna och inte går att handla med, utan i stället ger vissa bonusar till vänligt sinnade civilisationer.
Instead, diplomatic relations with City-States are determined by Influence - a meter of 'how much the City-State likes you'.\nInfluence can be increased by attacking their enemies, liberating their city, and giving them sums of gold. = Istället bestäms diplomatiska relationer med stadsstater av Inflytande - ett mått på 'hur mycket Stadsstaten tycker om dig'.\nInflytande kan ökas genom att anfalla deras fienter, befria deras stad, och genom att ge dem guld.
Certain bonuses are given when you are at above 30 influence.\nWhen you have above 60 Influence, and you have the highest influence with them of all civilizations, you are considered their 'Ally', and gain further bonuses and access to the Luxury and Strategic resources in their lands. = Vissa bonusar ges när du är över 30 inflytande.\nNär du har mer än 60 Inflytande, och du har det högsta inflytandet med dem av alla civilisationer, räknas du som deras 'Allierade', och får ytterligare bonusar samt tillgång till Lyxresurserna och de Strategiska Resurserna i deras gränser.

While working the land is good, eventually your Citizens will want to Specialize. = Att bruka jorden är bra, men förr eller senare vill invånarna specialisera sig.
Certain Buildings will also provide Specialist Slots. These slots will show up in the Citizen Management within the City Screen under Specialists. Each slot can be filled with a Citizen which will then become a Specialist. = Vissa byggnader ger också specialistplatser. De visas under Specialister i invånarhanteringen i stadsvyn. Varje plats kan fyllas av en invånare, som då blir specialist.
Each Specialist will generate a certain amount of yield as indicated to the right of the available slots. = Varje specialist genererar en viss avkastning, vilket visas till höger om de tillgängliga platserna.
While these are a great way to specialize the yield production of a City outside of the surrounding Tile Yields, Specialists have an additional value. Each one also generates Great Person Points each turn. With enough of them, a new Great Person will join your Nation. = Specialister är ett utmärkt sätt att specialisera en stads avkastning utöver de omgivande rutornas avkastning, men har även ett annat värde. Varje specialist genererar poäng för stora personer varje drag. När tillräckligt många poäng har samlats ansluter sig en ny stor person till nationen.
Great People = Stora Personer

Certain buildings, and specialists in cities, generate Great Person points per turn.\nThere are several types of Great People, and their points accumulate separately.\nThe number of points per turn and accumulated points can be viewed in the Overview screen. = Vissa byggnader, samt specialister i städer, genererar Stora Person-poäng per drag.\nDet finns flera sorters Stora Personer, och deras poäng ackumuleras separat.\nAntalet poäng per drag och ackumulerade poäng kan ses i Översiktsskärmen.
Alternatively, the Great Person points breakdown per city can be viewed in each City Screen (see UI Tips article). = Du kan också se fördelningen av poäng för stora personer per stad i respektive stadsvy (se artikeln Gränssnittstips).
Once enough points have been accumulated, a Great Person of that type will be created!\nEach Great Person can construct a certain Great Improvement which gives large yields over time, or immediately consumed to provide a certain bonus now. = När tillräckligt många poäng ackumulerats, kommer en Stor Person av motsvarande slag skapas!\nVarje Stor Person kan bygga en viss typ av Stor Förbättring som ger stor avkastning över tid, eller genast konsumeras för att ge en viss bonus nu.
Great Improvements also provide any strategic resources that are under them, so you don't need to worry if resources are revealed underneath your improvements! = Stora förbättringar ger också alla eventuella strategiska resurser som finns under dem, så du behöver inte oroa dig för om resurser dyker upp under dina förbättringar!

Removing Terrain Features = Ta bort Terrängdrag
Certain tiles have terrain features - like Flood plains or Forests -  on top of them. Some of these layers, like Jungle, Marsh and Forest, can be removed by workers.\nRemoving the terrain feature does not remove any resources in the tile, and is usually required in order to add improvements exploiting those resources. = Somliga rutor har terrängegenskaper - som Flodslätter eller Skogar - ovanpå sig. Vissa av dessa lager, som Djungel, Träsk, och Skog, kan avlägsnas av arbetare.\nAtt ta bort terrängegenskapen tar inte bort några resurser i rutan, och behövs ofta för att bygga förbättringar som utnyttjar dessa resurser.

Natural Wonders, such as the Mt. Fuji, the Rock of Gibraltar and the Great Barrier Reef, are unique, impassable terrain features, masterpieces of mother Nature, which possess exceptional qualities that make them very different from the average terrain.\nThey benefit by giving you large sums of Culture, ⍾Science, Gold or Production if worked by your Cities, which is why you might need to bring them under your empire as soon as possible. = Naturunderverk som Fuji, Gibraltarklippan och Stora barriärrevet är unika och oframkomliga terrängdrag, mästerverk av moder natur med egenskaper som tydligt skiljer dem från vanlig terräng.\nNär städer bearbetar dem ger de stora mängder kultur, ⍾vetenskap, guld eller produktion, och därför kan det vara viktigt att så snart som möjligt införliva dem i ditt rike.

Keyboard = Tangentbord
If you have a keyboard, some shortcut keys become available. Unit command or improvement picker keys, for example, are shown directly in their corresponding buttons. = Om du har ett tangentbord, så finns vissa snabbkommandon tillgängliga. Enhetskommandon eller förbättringsvalstangenter, till exempel, visas direkt i sina motsvarande knappar.
On the world screen the hotkeys are as follows: = På världskartan är snabbkomandona som följer:
Space or 'N' - Next unit or turn\n'E' - Empire overview (last viewed page)\n'+', '-' - Zoom in / out\nHome - center on capital or open its City Screen if already centered = Mellanslag eller 'N' - Nästa enhet eller drag\n'E' - Riksöversikt (senast visade flik)\n'+', '-' - Zooma in / ut\nHome - centrera på huvudstaden eller öppna dess stadsskärm om redan centrerat
F1 - Open Civilopedia\nF2 - Empire overview Trades\nF3 - Empire overview Units\nF4 - Empire overview Diplomacy\nF5 - Social policies\nF6 - Technologies\nF7 - Empire overview Cities\nF8 - Victory Progress\nF9 - Empire overview Stats\nF10 - Empire overview Resources\nF11 - Quicksave\nF12 - Quickload = F1 - Öppna Civilopedi\nF2 - Översikt Handelsavtal\nF3 - Översikt Enheter\nF4 - Översikt Diplomati\nF5 Samhällspolicys\nF6 - Teknologier\nF7 - Översikt Städer\nF8 - Segerstatus\nF9 - Översikt Statistik\n F10 - Översikt Resurser\nF11 - Snabbspara\nF12 - Snabbladda
Ctrl-R - Toggle tile resource display\nCtrl-Y - Toggle tile yield display\nCtrl-O - Game options\nCtrl-S - Save game\nCtrl-L - Load game\nCtrl-U - Toggle UI (World Screen only) = Ctrl-R – Visa eller dölj resurser på rutor\nCtrl-Y – Visa eller dölj rutornas avkastning\nCtrl-O – Spelalternativ\nCtrl-S – Spara spel\nCtrl-L – Läs in spel\nCtrl-U – Visa eller dölj gränssnittet (endast världsvyn)
All of these can be reassigned. = Alla dessa kan tilldelas på nytt.

This is where you spend most of your time playing Unciv. See the world, control your units, access other screens from here. = Här spenderar du större delen av din tid då du spelar Unciv. Du kan se världen, kontrollera dina enheter, och komma åt andra skärmar härifrån.
①: The menu button - civilopedia, save, load, options... = ①: Menyknappen - civilopedi, spara, ladda, alternativ...
②: The player/nation whose turn it is - click for diplomacy overview. = ②: Spelaren eller nationen vars drag det är – klicka för att öppna diplomatiöversikten.
③: The Technology Button - shows the tech tree which allows viewing or researching technologies. = ③: Teknologiknappen - visar teknologiträdet som låter dig se på eller forska fram teknologier.
④: The Social Policies Button - shows enacted and selectable policies, and with enough culture points you can enact new ones. = ④: Samhällspolicyknappen - visar anammade och valbara policys, och med tillräckligt många kulturpoäng kan du anamma nya.
⑤: The Diplomacy Button - shows the diplomacy manager where you can talk to other civilizations. = ⑤: Diplomatiknappen - visar diplomatiöverblicken där du kan tala med andra civilisationer.
⑥: Unit Action Buttons - while a unit is selected its possible actions appear here. = ⑥: Enhetshandlingsknappar - då en enhet är vald visas dess möjliga handlingar här.
⑦: The unit/city info pane - shows information about a selected unit or city. = ⑦: Enhets-/Stadsinformationspanelen - visar information om en vald enhet eller stad.
⑧: The name (and unit icon) of the selected unit or city, with current health if wounded. Clicking a unit name or icon will open its civilopedia entry. = ⑧: Namnet (och enhetsikonen) på den valda enheten eller staden, med dess nuvarande hälsa om den är skadad. Genom att klicka enhetens namn eller ikon öppnas dess civilopediartikel.
⑨: The arrow buttons allow jumping to the next/previous idle unit. = ⑨: Med pilknapparna kan du hoppa till nästa eller föregående overksamma enhet.
⑩: For a selected unit, its promotions appear here, and clicking leads to the promotions screen for that unit. = ⑩: För en vald enhet visas dess befordringar här. Klicka för att öppna enhetens befordringsvy.
⑪: Remaining/per turn movement points, strength and experience / XP needed for promotion. For cities, you get its combat strength. = ⑪: Återstående/per drag förflyttningspoäng, styrka och erfarenhet / EP som behövs för befordring. För städer visas dess stridsstyrka.
⑫: This button closes the selected unit/city info pane. = ⑫: Denna knapp stänger den valda enhets-/stadsinfopanelen.
⑬: This pane appears when you order a unit to attack an enemy. On top are attacker and defender with their respective base strengths. = ⑬: Denna panel visas då du beordrar en enhet att anfalla fienden. Överst visas anfallaren och försvararen med deras respektive grundstyrkor.
⑭: Below that are strength bonuses or penalties and health bars projecting before / after the attack. = ⑭: Nedanför det finns styrkebonusar eller -avdrag samt hälsoindikatorer som visar före / efter anfallet.
⑮: The Attack Button - let blood flow! = ⑮: Anfallsknappen - låt blodet flyta!
⑯: The minimap shows an overview over the world, with known cities, terrain and fog of war. Clicking will position the main map. = ⑯: Minatyrkartan visar en översikt över världen, med kända städer, terräng och krigsdimma. Genom att klicka här kan man ändra huvudvyns position.
⑰: To the side of the minimap are display feature toggling buttons - tile yield, worked indicator, show/hide resources. These mirror setting on the options screen and are hidden if you deactivate the minimap. = ⑰: Bredvid miniatyrkartan finns knappar för att visa ytterligar information - rutavkastning, arbetsindikatorer, visa/dölj resurser. De motsvarar inställningarna på spelalternativsskärmen och döljs om miniatyrkartan avaktiveras.
⑱: Tile information for the selected hex - current or potential yield, terrain, effects, present units, city located there and such. Where appropriate, clicking a line opens the corresponding civilopedia entry. = ⑱: Information om den valda hexagonrutan – aktuell eller möjlig avkastning, terräng, effekter, närvarande enheter, eventuell stad med mera. När det är relevant öppnar ett klick på en rad motsvarande artikel i Civilopedian.
⑲: Notifications - what happened during the last 'next turn' phase. Some are clickable to show a relevant place on the map, some even show several when you click repeatedly. = ⑲: Aviseringar – det som hände under den senaste fasen ”Nästa drag”. Vissa är klickbara och visar en relevant plats på kartan. En del visar flera platser om du klickar upprepade gånger.
⑳: The Next Turn Button - unless there are things to do, in which case the label changes to 'next unit', 'pick policy' and so on. = ⑳: Nästa Drag-knapp - om det inte återstår saker att göra, i vilket fall texten ändras till 'nästa enhet', 'välj en policy', osv.
㉑: The Multiplayer Button - Here you can easily check your active multiplayer games. = ㉑: Flerspelarknappen – här kan du enkelt kontrollera dina aktiva flerspelarspel.
ⓐ: The overview button leads to the empire overview screen with various tabs (the last one viewed is remembered) holding vital information about the state of your civilization in the world. = ⓐ: Översiktsknappen leder till riksöversiktsskärmen med diverse flikar (den senast öppnade komms ihåg) som innehåller viktig information om din civilisations tillstånd i världen.
ⓑ: The ♪Culture icon shows accumulated ♪Culture and ♪Culture needed for the next policy - in this case, the exclamation mark tells us a next policy can be enacted. Clicking is another way to the policies manager. = ⓑ: Kulturikonen visar ackumulerad kultur och hur mycket kultur som behövs för nästa policy - i detta fall kan vi se från utropstecknet att nästa policy kan anammas. Genom att klicka det kommer man till policyskärmen.
ⓒ: Your known strategic resources are displayed here with the available (usage already deducted) number - click to go to the resources overview screen. = ⓒ: Dina kända strategiska resurser visas här med det tillgängliga antalet, efter avdragen förbrukning. Klicka för att öppna resursöversikten.
ⓓ: Happiness/unhappiness balance and either golden age with turns left or accumulated happiness with amount needed for a golden age is shown next to the smiley. Clicking also leads to the resources overview screen as luxury resources are a way to improve happiness. = ⓓ: Lycka/olycklighet netto och antingen guldålder med antal drag kvar eller ackumulerad lycka med den mängd som behövs för en guldålder visas bredvid smileyn. Genom att klicka kommer man även här till resursöversiktsskärmen eftersom lyxresurser är ett sätt att öka lycka.
ⓔ: The ⍾Science icon shows the number of ⍾Science points produced per turn. Clicking leads to the technology tree. = ⓔ: Vetenskapsikonen visar antal vetenskapspoäng som produceras per drag. Om man klickar på den kommer man till teknologiträdet.
ⓕ: Number of turns played with translation into calendar years. Click to see the victory overview. = ⓕ: Antal drag spelat, med översättning till kalenderår. Klicka för att se segeröversikten.
ⓖ: The number of gold coins in your treasury and income. Clicks lead to the Stats overview screen. = ⓖ: Antal guldmynt i din skattkammare samt inkomst. Klicka för att komma till statistiköversiktsskärmen.
ⓗ: The quantity of ☮Faith your citizens have generated, or 'off' if religion is disabled. Clicking it makes you go to the religion overview screen. = ⓗ: Mängden ☮tro som invånarna har genererat, eller ”av” om religion är inaktiverad. Klicka för att öppna religionsöversikten.
ⓧ: In the center of all this - the world map! Here, the "X" marks a spot outside the map. Yes, unless the wrap option was used, Unciv worlds are flat. Don't worry, your ships won't fall off the edge. = ⓧ: I mitten av allt - världskartan! Här visar "X"et ett plats utanför kartan. Ja, om man inte valt världsrundningsalternativet, är Uncivs kartor platta. Oroa dig inte, dina skepp kommer inte ramla över kanten.
ⓨ: By the way, here's how an empire border looks like - it's in the national colours of the nation owning the territory. = ⓨ: Det här är för övrigt hur en riksgräns ser ut - den har samma färger som nationen som äger territoriet.
ⓩ: And this is the red targeting circle that led to the attack pane back under ⑬. = ⓩ: Och det här er den röda målcirkeln som ledde till anfallspanelen förut under ⑬.
What you don't see: The phone/tablet's back button will pop the question whether you wish to leave Unciv and go back to Real Life. On desktop versions, you can use the ESC key. = Vad du inte ser: Telefonens/Surfplattans bakåtknapp kommer ställa frågan huruvida du vill lämna Unciv och återgå till Verkliga Livet. På datorversioner kan du använda ESC-tangenten.

When at later stages of the game, you might have a lot of units but only a little to do. To help you we have implemented an AutoPlay feature that lets you use the AI to play part or all of your turn. = I spelets senare skeden kan du ha många enheter men ganska lite att göra. Därför finns funktionen Autospel, som låter AI:n spela delar av eller hela ditt drag.
To enable AutoPlay, go to options and open the AutoPlay tab and press "Show AutoPlay button". = För att aktivera Autospel går du till alternativen, öppnar fliken Autospel och trycker på ”Visa knappen Autospel”.
Clicking on the AutoPlay button opens a popup menue for choosing to AutoPlay parts or all of your turn. = När du klickar på knappen Autospel öppnas en meny där du väljer vilka delar av eller om hela draget ska spelas automatiskt.
Clicking Start AutoPlay in the pop-up menue or long pressing the AutoPlay button begins the multi-turn AutoPlay. This will play your next turns as if you were an AI. = Om du klickar på ”Starta Autospel” i menyn eller håller knappen Autospel nedtryckt startar autospel över flera drag. Dina följande drag spelas då som om du vore en AI.
To cancel multi-turn AutoPlay you can press the AutoPlay button, next turn button or open the options menue. = Du kan avbryta autospel över flera drag genom att trycka på knappen Autospel eller Nästa drag, eller genom att öppna alternativmenyn.
Multi-turn AutoPlay is not advised on harder difficulty levels as your AI will not play better against an AI with modifiers. = Autospel över flera drag rekommenderas inte på högre svårighetsgrader, eftersom din AI inte spelar bättre mot en AI som har modifierare.
Multi-turn AutoPlay for multiplayer is not yet supported. = Autospel över flera drag stöds ännu inte i flerspelarläget.

After building a shrine, your civilization will start generating ☮Faith. = Efter att en helgedom byggts, börjar din civilisation generera Tro☮.
When enough ☮Faith has been generated, you will be able to found a pantheon. = När tillräckligt med Tro☮ genererats, kommer du kunna stifta ett panteon.
A pantheon will provide a small bonus for your civilization that will apply to all cities that have it as a majority religion. = En panteon ger en mindre bonus till civilisationen som gäller i alla städer där den är majoritetsreligion.
Each civilization can only choose a single pantheon belief, and each pantheon can only be chosen once. = Varja civilisation kan endast välja en panteontrossats, och varja panteon kan bara väljas en gång.
Generating more ☮Faith will allow you to found a religion. = Genom att generera mer tro kommer du kunna stifta en religion.

Keep generating ☮Faith, and eventually a great prophet will be born in one of your cities. = Fortsätt generera Tro☮, så kommer så småningom en stor profet födas i en av dina städer.
This great prophet can be used for multiple things: Constructing a holy site, founding a religion and spreading your religion. = Denna stora profet kan användas för flera olika saker: Bygga en helig plats, stifta en religion, och sprida din religion.
When founding your religion, you may choose another two beliefs. The founder belief will only apply to you, while the follower belief will apply to all cities following your religion. = När du stiftar din religion, kan du välja två ytterligare trossatser. Grundartrossatsen kommer endast gälla dig, medan följeslagartrossatsen kommer gälla alla städer som följer din religion.
Additionally, the city where you used your great prophet will become the holy city of that religion. = Förutom detta, kommer den stad där du använt din stora profet bli den nya religionens heliga stad.
Once you have founded a religion, great prophets will keep being born every so often, though the amount of Faith☮ you have to save up will be higher. = När du stiftat en religion, kommer stora profeter fortsätta födas då och då, fast mängden Tro☮ du behöver spara kommer öka.
One of these great prophets can then be used to enhance your religion. = En av dessa stora profeter kan då användas för att förbättra din religion.
This will allow you to choose another follower belief, as well as an enhancer belief, that only applies to you. = Detta låter dig välja ytterligare en följeslagartrossats, som bara gäller dig.
Do take care founding a religion soon, only about half the players in the game are able to found a religion! = Se till att stifta en religion snart, endast cirka hälften av spelarna i spelet kan stifta en religion!

Religion inside cities = Religion i städer
When founding a city, it won't follow a religion immediately. = När en stad grundas, kommer den från början inte ha en religion.
The religion a city follows depends on the total pressure each religion has within the city. = Religionen en stad följer beror på det totala trycket varje religion utövar i staden.
Followers are allocated in the same proportions as these pressures, and these followers can be viewed in the City Screen. = Följeslagare tilldelas i proportion efter dessa tryck, och dessa följeslagare visas i stadsskärmen.
You are allowed to check religious followers and pressures in cities you do not own by selecting them. = Du kan se religiösa följeslagare och tryck i städer du inte äger genom att välja dem.
In both places, a tap/click on the icon of a religion will show detailed information with its effects. = I båda platser kommer ett klick på en religions ikon visa detaljerad information med dess effekter.
Based on this, you can get a feel for which religions have a lot of pressure built up in the city, and which have almost none. = Baserat på detta, kan du få ett intryck av vilka religioner som har byggt upp mycket tryck i staden, och vilka som har mycket litet.
The city follows a religion if a majority of its population follows that religion, and will only then receive the effects of Follower and Pantheon beliefs of that religion. = Staden följer en religion om merparten av dess befolkning följer denna religion, och kommer endast då få effekten av Följeslagar- och Panteontrossatserna av den religionen.

Spreading Religion = Sprida Religion
Spreading religion happens naturally, but can be sped up using missionaries or great prophets. = Relgion sprids naturligt, men kan skyndas på med hjälp av missionärer eller stora profeter.
Missionaries can be bought in cities following a major religion, and will take the religion of that city. = Missionärer kan köpas i städer som följer en stor religionen, och kommer få den stadens religion.
So do take care where you are buying them! If another civilization has converted one of your cities to their religion, missionaries bought there will follow their religion. = Så se upp med var du köper dem! Om en annan civilisation har omvänt en av dina städer till sin religion, kommer missionärer som köps där följa deras religion.
Great prophets always have your religion when they appear, even if they are bought in cities following other religions, but captured great prophets do retain their original religion. = Stora profeter har alltid din religion när de dyker upp, även om de köps i städer som följer andra religioner, men tillfångatagna stora profeter behåller sin ursprungliga religion.
Both great prophets and missionaries are able to spread religion to cities when they are inside its borders, even cities of other civilizations. = Både stora profeter och missionärer kan sprida religion till städer när de befinner sig inom dess gränser, även till andra civilisationers städer.
These two units can even enter tiles of civilizations with whom you don't have an open borders agreement! = Dessa två enheter kan rentav gå in i rutor med vars civilisationer du inte har något avtal om öppna gränser!
But do take care, missionaries will lose 250 religious strength each turn they end while in foreign lands. = Men se upp, missionärer kommer förlora 250 religiös styrka varje drag de avslutar i främmande länder.
This diminishes their effectiveness when spreading religion, and if their religious strength ever reaches 0, they have lost their faith and disappear. = Dett minskar deras effektivitet för att sprida religion, och om deras religiösa styrka någonsin når 0, har de förlorat sin tro och försvinner.
When you do spread your religion, the religious strength of the unit is added as pressure for that religion. = När du sprider din religion, kommer enhetens religiösa styrka läggas till trycket för den religionen.
Cities also passively add pressure of their majority religion to nearby cities. = Städer lägger även passivt till tryck för sin majoritetsreligion till närliggande städer.
Each city provides +6 pressure per turn to all cities within 10 tiles, though the exact amount of pressure depends on the game speed. = Varje stad ger +6 tryck per drag till alla städer inom 10 rutor, men den exakta mängden tryck beror på spelets hastighet.
This pressure can also be seen in the City Screen, and gives you an idea of how religions in your cities will evolve if you don't do anything. = Detta tryck kan även ses i stadsskärmen, och ger dig en uppfattning om hur religionerna i dina städer kommer utvecklas om du inte gör något.
Holy cities also provide +30 pressure of the religion founded there to themselves, making it very difficult to effectively convert a holy city. = Heliga städer kan även ge +30 tryck för religionen som grundats där till sig själva, vilket gör det mycket svårt att framgångsrikt omvända en helig stad.
Lastly, before founding a religion, new cities you settle will start with 200 pressure for your pantheon. = Slutligen, innan du stiftat en religion, kommer nya städer du grundar starta med 200 tryck för din panteon.
This way, all your cities will starting following your pantheon as long as you haven't founded a religion yet. = På så sätt kommer alla dina städer börja med att följa din panteon så länge som du inte stiftat en religion än.

Inquisitors = Inkvisitorer
Inquisitors are the last religious unit, and their strength is removing other religions. = Inkvisitorer är den sista religiösa enhet, och deras styrka ligger i att avlägsna andra religioner.
They can remove all other religions from one of your own cities, removing any pressures built up. = De kan avlägsna alla andra religioner från en av dina egna städer, vilket tar bort allt tryck som byggts upp.
Great prophets also have this ability, and remove all other religions in the city when spreading their religion. = Stora profeter har också denna förmåga, och tar bort alla andra religioner i staden då de sprider sin religion.
Often this results in the city immediately converting to their religion = Detta leder ofta till att staden genast omvänds till deras religion
Additionally, when an inquisitor is stationed in or directly next to a city center, units of other religions cannot spread their faith there, though natural spread is unaffected. = Dessutom, när en inkvisitor befinner sig i eller alldeles bredvid en stadskärna, kan andra religioners enheter inte sprida sin tro där, fast naturlig spridning påverkas inte.

The Mayan unique ability, 'The Long Count', comes with a side effect: = Mayanernas unika förmåga, 'Långa Räkningen', har en bieffekt:
Once active, the game's year display will use mayan notation. = När den aktiverats visas spelets år med mayansk notering.
The Maya measured time in days from what we would call 11th of August, 3114 BCE. A day is called K'in, 20 days are a Winal, 18 Winals are a Tun, 20 Tuns are a K'atun, 20 K'atuns are a B'ak'tun, 20 B'ak'tuns a Piktun, and so on. = Mayanerna mätte tiden i dagar från vad vi skulle kalla 11:e augusti, 3114 f kr. En dag kallas Kin, 20 dagar är en Winal, 18 Winaler är en Tun, 20 Tuner är en Katun, 20 Katuner är en Baktun, 20 Baktuner en Piktun, och så vidare.
Unciv only displays ය B'ak'tuns, ඹ K'atuns and ම Tuns (from left to right) since that is enough to approximate gregorian calendar years. The Maya numerals are pretty obvious to understand. Have fun deciphering them! = Unciv visar endast ය Baktuner, ඹ Katuner and ම Tuner (från vänster till höger) eftersom det räcker för att komma nära nog gregorianska kalenderår. Det mayanska talsystemet är inte svårt att förstå. Roa dig med att uttyda dem!

Your cities will periodically demand different luxury goods to satisfy their desire for new things in life. = Dina städer kommer då och då kräva olika lyxresurser för att tillfredsställa sina behov för nya upplevelser.
If you manage to acquire the demanded luxury by trade, expansion, or conquest, the city will celebrate We Love The King Day for 20 turns. = Om du lyckas få tag på den krävda resursen genom handel, expansion eller erövring kommer staden fira Vi Älskar Kungen-Dagen i 20 drag.
During the We Love The King Day, the city will grow 25% faster. = Under Vi Älskar Kungen-Dagen kommer staden växa 25% snabbare.
This means exploration and trade is important to grow your cities! = Det betyder att utforskning och handel är viktigt för att få dina städer att växa!

Air Combat and Interception = Luftstrid och avvärjning
Air Combat is very similar to normal Combat, with a few wrinkles. Damage is still dealt using the same equations based on the relative Strength of the Attacking and Defending Unit. = Luftstrid liknar vanlig strid, men har några särskilda moment. Skadan beräknas fortfarande med samma formler utifrån den anfallande och försvarande enhetens relativa styrka.
However, before the Attacker and Defender fight, there is an added combat phase called Interception. If there is any unit with Interception Range that covers the target attacked tile, then it will attempt to Intercept the Attacking Air Unit. If multiple units can Intercept, the one with higher Intercept chance does it. = Innan angriparen och försvararen strider tillkommer dock en stridsfas som kallas avvärjning. Om någon enhet har ett avvärjningsområde som täcker den angripna målrutan försöker den avvärja den anfallande luftenheten. Om flera enheter kan avvärja gör enheten med högst avvärjningschans det.
Generally Land/Naval Units have an Intercept Range of 2 Tiles, and Air Units have an Intercept Range of their Attack Range. = Land- och sjöenheter har i allmänhet ett avvärjningsområde på två rutor, medan luftenheters avvärjningsområde motsvarar deras anfallsräckvidd.
Ground and Naval Units don't require movement points to Intercept, just Attacks. Air Units cannot have moved nor attacked in the preceding turn. = Mark- och sjöenheter behöver inga förflyttningspoäng för att avvärja, endast ett återstående anfall. Luftenheter får inte ha flyttat eller anfallit under föregående drag.
The Intercepting Unit rolls to see if it hits. Whether it hits or not costs an Attack, and most units (without Promotions) can only Attack Once per Nation's Turn. It does NOT cost Movement Points, but Air Units that have used their Movement cannot Intercept between turns. = Den avvärjande enheten slår ett slag för att avgöra om den träffar. Ett anfall förbrukas oavsett om den träffar, och de flesta enheter utan befordringar kan endast anfalla en gång per nationsdrag. Det kostar INGA förflyttningspoäng, men luftenheter som har förbrukat sin förflyttning kan inte avvärja mellan dragen.
If the Intercepting Unit Hits, it deals damage according to the Combat Strength calculation to the Attacking Air Unit, potentially with any Strength Bonuses that apply to Interception. It does not receive damage from the Attacking Air Unit. = Om den avvärjande enheten träffar skadar den den anfallande luftenheten enligt beräkningen av stridsstyrka, inklusive eventuella styrkebonusar som gäller för avvärjning. Den tar ingen skada av den anfallande luftenheten.
After Interception resolves, the Attacking Air Unit and the Defending Unit in the targeted tile do Combat as normal, with damage dealt to both sides. = När avvärjningen är avgjord strider den anfallande luftenheten och den försvarande enheten på målrutan som vanligt, och båda sidor kan ta skada.
To help deal with Interceptions, see Air Sweeps. = Se luftpatrullering för information om hur du hanterar avvärjning.

Air Sweeps = Luftpatrullering
Fighter units are able to perform Air Sweeps over a tile helping clear out potential enemy Air, Sea, or Land Interceptions that can reach that tile. = Jaktflyg kan utföra luftpatrullering över en ruta för att röja undan möjliga fientliga avvärjningar från luft-, sjö- eller landenheter som når rutan.
While this Action will take an Attack, the benefit is drawing out Interceptions to help protect your other Air Units. Especially your Bombers. = Åtgärden förbrukar ett anfall, men lockar fram avvärjning och skyddar därmed dina andra luftenheter, särskilt bombflyg.
Your unit will always draw an Interception, if one can reach the target tile, even if the Intercepting unit has a chance to miss. = Din enhet framkallar alltid en avvärjning om någon avvärjare kan nå målrutan, även om den avvärjande enheten kan missa.
If the Interceptor is not an Air Unit (eg Land or Sea), the Air Sweeping unit and Interceptor take no damage! = Om avvärjaren inte är en luftenhet, till exempel en land- eller sjöenhet, tar varken den luftpatrullerande enheten eller avvärjaren skada!
If the Interceptor is an Air Unit, the two units will damage each other in a straight fight with no Interception bonuses. And only the Attacking Air Sweep Unit gets any Air Sweep strength bonuses. = Om avvärjaren är en luftenhet skadar de båda enheterna varandra i en direkt strid utan avvärjningsbonusar. Endast den anfallande luftpatrulleringsenheten får eventuella styrkebonusar för luftpatrullering.

Fortify, Guard, Withdraw = Befäst, vakta, retirera
Most Land units have the ability to Fortify. As they spend time without moving, they will slowly gain a Fortification Bonus to their Combat Strength representing digging in and preparing in case of an attack. = De flesta landenheter kan befästa sig. Ju längre de står stilla, desto större befästningsbonus får de till sin stridsstyrka, vilket motsvarar att de gräver ned sig och förbereder sig inför ett möjligt anfall.
Some units have the ability to Withdraw before a melee attack is struck. However, perhaps you wish for them to stand their ground to protect a particular tile. If you do, then give them the Guard command and they will stay fixed until they die or you give them fresh orders. = Vissa enheter kan retirera före ett närstridsanfall. Du kanske ändå vill att de håller sin position för att skydda en viss ruta. Ge dem då ordern Vakta, så stannar de tills de dör eller får nya order.
This is NOT the same as Fortify but they will still gain the Fortification Bonus. They will simply not utilize their Withdraw ability. Fortified units with the Withdraw ability will try to flee when attacked. = Detta är INTE samma sak som att befästa sig, men de får ändå befästningsbonusen. De använder helt enkelt inte sin förmåga att retirera. Befästa enheter med retireringsförmåga försöker fly när de angrips.

City Tile Blockade = Blockad av stadsrutor
One of your tiles is blocked by an enemy: when an enemy unit stands on a tile you own, the tile will not produce yields and cannot be worked by a city this turn. City will reallocate population from a blocked tile automatically. = En av dina rutor blockeras av en fiende: när en fientlig enhet står på en ruta du äger ger rutan ingen avkastning och kan inte bearbetas av en stad under det här draget. Staden omfördelar automatiskt befolkningen från den blockerade rutan.
Enemy military land units block tiles they are standing on. Enemy military naval units additionally block adjacent water tiles. To protect your tiles from blockade, place a friendly military unit on it or fight off invaders. = Fientliga militära landenheter blockerar rutan de står på. Fientliga militära sjöenheter blockerar dessutom angränsande vattenrutor. Skydda rutorna mot blockad genom att placera en vänlig militär enhet där eller besegra inkräktarna.

One of your cities is under a naval blockade! When all adjacent water tiles of a coastal city are blocked - city loses harbor connection to all other cities, including capital. Make sure to de-blockade cities by deploying friendly military naval units to fight off invaders. = En av dina städer är under sjöblockad! När alla angränsande vattenrutor till en kuststad blockeras förlorar staden sin hamnförbindelse med alla andra städer, inklusive huvudstaden. Häv blockaden genom att sätta in vänliga militära sjöenheter mot inkräktarna.

Spies! = Spioner!
The first time a civ reaches the Renaissance era each nation gets one spy. Every time a civ reaches an era afterwards they get one more spy. = Första gången en civilisation når renässansen får varje nation en spion. Varje gång en civilisation därefter når en ny epok får den ytterligare en spion.
Spies can be sent out to foreign cities to steal technology, rigging elections or stage coups. Place them in your own cities to do counter-intelligence work. = Spioner kan skickas till utländska städer för att stjäla teknologi, manipulera val eller genomföra kupper. Placera dem i egna städer för kontraspionage.
Only one spy per civ is allowed in each city. Spies that are not in any city are on vacation in your spy hideout. = Endast en spion per civilisation får finnas i varje stad. Spioner som inte befinner sig i någon stad är på semester i ditt spiongömställe.
Spies set up in cities of major civilizations will try to steal technology at a rate which is based off of the science production in the city. Succeeding to steal technology will level up your spy. Failing to succeed will level up the defending spy if it is present. = Spioner i större civilisationers städer försöker stjäla teknologi med en hastighet som beror på stadens vetenskapsproduktion. En lyckad stöld höjer spionens nivå. Ett misslyckande höjer den försvarande spionens nivå om en sådan finns.
Spies set in city-states will try to rig the elections in order to gain influence and reduce the influence of other civilizations. Only one spy partaking in rigging the election can win. = Spioner i stadsstater försöker manipulera valen för att öka ditt inflytande och minska andra civilisationers. Endast en av de spioner som deltar i valmanipulationen kan vinna.
A spy that is rigging an election in a city-state may also stage a coup. The likelihood of success for the coup depends on your relative influence to the current ally of the city-state, your spy level, and the level of the spy that the current ally has in the city-state if present. Succeeding a coup will make you their new ally and reduce the influence of all other civs. Failing a coup will kill your spy and level up the defending spy if present. = En spion som manipulerar val i en stadsstat kan också försöka genomföra en kupp. Chansen att lyckas beror på ditt relativa inflytande jämfört med stadsstatens nuvarande allierade, din spions nivå och nivån på den allierades eventuella spion i stadsstaten. En lyckad kupp gör dig till ny allierad och minskar alla andra civilisationers inflytande. En misslyckad kupp dödar din spion och höjer den försvarande spionens nivå, om en sådan finns.
Spies that are set up in your own cities will be conducting counter-intelligence. They reduce the success chance of other spies trying to steal your technology. = Spioner i dina egna städer bedriver kontraspionage. De minskar andra spioners chans att lyckas stjäla din teknologi.
Spies at a higher rank have a higher chance of success. The max rank a spy can reach is rank 3. After a spy is killed it will revive after a certain amount of turns back at rank 1. = Spioner av högre rang har större chans att lyckas. Högsta möjliga rang är 3. När en spion dödas återkommer den efter ett visst antal drag på rang 1.
Building buildings like the constabulary and police station will reduce the technology steal rate of spies in that city. = Byggnader som konstapelstationen och polisstationen minskar den hastighet med vilken spioner stjäl teknologi i staden.
Espionage is available using the Gods and Kings ruleset. To enable it in a new game click advanced settings, then click on the Enable Espionage option. = Spioneri är tillgängligt med regelverket Gods and Kings. Aktivera det i ett nytt spel genom att öppna avancerade inställningar och markera ”Aktivera spioneri”.

Keyboard Bindings = Tangentbindningar
Limitations = Begränsningar
This is a work in progress. = Detta är ett pågående arbete.
For technical reasons, only direct keys or Ctrl-Letter combinations can be used. = Av tekniska skäl kan endast enskilda tangenter eller kombinationer med Ctrl och en bokstav användas.
Using the Keys page = Använda tangentsidan
Each binding has a button with an image looking like this: = Varje bindning har en knapp med en bild som ser ut så här:
While hovering the mouse over the key button, you can press a desired key directly to assign it. = När muspekaren är över tangentknappen kan du trycka på önskad tangent för att tilldela den direkt.
Double-click the image to reset the binding to default. = Dubbelklicka på bilden för att återställa bindningen till standardvärdet.
Bindings mapped to their default keys are displayed in gray, those reassigned by you in white. = Bindningar som använder sina standardtangenter visas i grått, medan bindningar som du har ändrat visas i vitt.
Conflicting assignments are marked red. Conflicts can exist across categories, like World Screen / Unit Actions. Note that at the moment, the game does not prevent saving conflicting assignments, though the result may be unexpected. = Motstridiga tilldelningar markeras med rött. Konflikter kan finnas mellan kategorier, till exempel Världsvy och Enhetsåtgärder. Spelet förhindrar för närvarande inte att motstridiga tilldelningar sparas, även om resultatet kan bli oväntat.
For discussion about missing entries, see the linked github issue. = Se det länkade Github-ärendet för diskussion om poster som saknas.

Welcome to the Civilopedia! = Välkommen till Civilopedian!
Here you can find information - general help, rules, and what makes up the game world. = Här hittar du information: allmän hjälp, regler och allt som bygger upp spelvärlden.
How to find information = Så hittar du information
Select categories with the buttons on top of the screen. Also up there is the button to leave Civilopedia and go back to where you were before. = Välj kategorier med knapparna högst upp på skärmen. Där finns också knappen för att lämna Civilopedian och återvända till föregående vy.
Each category has a list of entries on the left of the screen, sorted alphabetically (with few exceptions). Clicking an entry will update the center pane were you are currently reading this. = Varje kategori har en alfabetiskt sorterad lista över poster till vänster på skärmen, med några få undantag. När du klickar på en post uppdateras mittpanelen där du läser detta.
Lines can link to other Civilopedia entries, they are marked with a chain link symbol like this one. You can click anywhere on the line to follow the link. = Rader kan länka till andra poster i Civilopedian och markeras då med en kedjelänkssymbol som den här. Klicka var som helst på raden för att följa länken.
The current category is special - all articles on general concepts are here. It is called 'Tutorials' because you can revisit these here, too. = Den aktuella kategorin är speciell: här finns alla artiklar om allmänna begrepp. Den kallas ”Övningar” eftersom du också kan återvända till övningarna här.
What information can I find = Vilken information finns här?
The data shown is not dependent on your current game's situation, e.g. bonuses for the nation you are playing or difficulty modifiers will not affect the numbers. = Uppgifterna som visas beror inte på situationen i det aktuella spelet. Exempelvis påverkar bonusar för nationen du spelar eller svårighetsmodifierare inte siffrorna.
However, it will reflect the mods you are playing! The combination of base ruleset and extension mods you select define the rules of a game, what objects exist and how they interact, and the Civilopedia mirrors these rules. = Däremot återspeglar de moddar du spelar med! Kombinationen av grundregelverk och valda tilläggsmoddar bestämmer spelets regler, vilka objekt som finns och hur de samverkar, och Civilopedian återger dessa regler.
If you opened the Civilopedia from the main menu, the "Ruleset" will be that of the last game you started. = Om du öppnade Civilopedian från huvudmenyn används regelverket från det senaste spelet du startade.
Letters can select categories, and when there are multiple categories matching the same letter, you can press that repeatedly to cycle between these. = Bokstavstangenter kan välja kategorier. Om flera kategorier börjar med samma bokstav kan du trycka upprepade gånger för att växla mellan dem.
The arrow keys allow navigation as well - left/right for categories, up/down for entries. = Du kan också navigera med piltangenterna: vänster och höger mellan kategorier samt upp och ned mellan poster.

UI Tips = Gränssnittstips
World screen = Världsvy
Skip all units to end a turn quickly = Hoppa över alla enheter för att snabbt avsluta ett drag
Right-click or long press the "Next unit" button to open a popup menu which allows to end a turn without having to cycle through all units. If some units are automated, a dedicated button is available to move them before ending the turn. = Högerklicka eller håll knappen ”Nästa enhet” nedtryckt för att öppna en meny där du kan avsluta draget utan att gå igenom alla enheter. Om några enheter är automatiserade finns en särskild knapp för att flytta dem innan draget avslutas.
Toggle notification list display = Visa eller dölj aviseringslistan
On the World screen, swipe the notification list to the right to temporarily hide it. Click the "Bell" button to display them again. = Svep aviseringslistan åt höger i världsvyn för att tillfälligt dölja den. Klicka på klockknappen för att visa den igen.
The default state for the notification list can be set in Options > Display > UI - Notifications on world screen. = Standardläget för aviseringslistan kan anges under Alternativ → Skärm → Gränssnitt → Aviseringar i världsvyn.
Entering a City Screen quickly = Öppna stadsvyn snabbt
You can Right-click or long press a city button on the World screen. The result is the same as tapping it twice - once to select and move the button, again to trigger a reaction: show the City Screen (if the city is yours to inspect), or offer the foreign city info popup. = Du kan högerklicka eller hålla en stadsknapp nedtryckt i världsvyn. Resultatet är detsamma som att trycka två gånger: först för att välja och flytta knappen och sedan för att utföra åtgärden, det vill säga visa stadsvyn om staden är din eller öppna informationsrutan för en främmande stad.
Upgrade multiple units of the same type = Uppgradera flera enheter av samma typ
On the World screen, select an unit that can be upgraded, then right-click or long press the "Upgrade" button to open a popup menu allowing to upgrade all units of this type at once. = Välj i världsvyn en enhet som kan uppgraderas och högerklicka eller håll knappen ”Uppgradera” nedtryckt för att öppna en meny där alla enheter av samma typ kan uppgraderas samtidigt.
In the Units overview, the same upgrade menu is available by clicking the unit icon in the "Upgrade" column. When an unit is upgradeable, the icon is lit if conditions are met (enough gold and/or resources), otherwise it is dimmed. = I enhetsöversikten finns samma uppgraderingsmeny när du klickar på enhetsikonen i kolumnen ”Uppgradera”. Om enheten kan uppgraderas är ikonen upplyst när villkoren är uppfyllda, till exempel tillräckligt med guld eller resurser, och annars nedtonad.
Additional controls for the construction queue = Fler kontroller för byggkön
Right-click or long press a construction item to open a popup menu with additional controls, allowing to manage production of the same item in all cities, by issuing the commands from the same City Screen. = Högerklicka eller håll ett objekt i byggkön nedtryckt för att öppna en meny med fler kontroller. Där kan du hantera produktionen av samma objekt i alla städer genom kommandon från samma stadsvy.
 # Requires translation!
The "Disable" option (in a single city or all cities) moves an item to a separated "Disabled" tab, to prevent its automatic queueing by the "Auto-assign city production" option or to remove irrelevant objects from the production planning. To move a disabled item back to its initial place, re-enter its popup menu, and choose "Enable". = 
 # Requires translation!
Disabled items are set for the current game only and are carried over when founding a new city. = 
Show Great Person Points breakdown = Visa fördelningen av poäng för stora personer
In the right sidepanel, click a Great People row to display the details of Great Person Points (GPP) accumulated each turn by the current city, for this type of Great People. = Klicka på en rad för en stor person i den högra sidopanelen för att visa information om de poäng för stora personer som den aktuella staden samlar varje drag för den typen.
Click any of the Great People icons to display all GPP accumulated each turn by the current city, for all types of Great People. = Klicka på någon av ikonerna för stora personer för att visa alla poäng för stora personer som den aktuella staden samlar varje drag, för samtliga typer.
Tech screen = Teknikvy
Queue multiple technologies in different branches = Kölägg flera teknologier från olika grenar
On the Tech screen, right-click or long press a technology to automatically queue it, even if this tech is in another branch than the item currently researched. Prerequisite techs to research will also be automatically queued. = Högerklicka eller håll en teknologi nedtryckt i teknikvyn för att automatiskt lägga den i kön, även om den ligger i en annan gren än teknologin som för närvarande forskas fram. Nödvändiga föregående teknologier läggs också automatiskt i kön.
Right-click or long press multiple techs to append them to the research queue, whatever their branch is. = Högerklicka eller håll flera teknologier nedtryckta för att lägga till dem sist i forskningskön, oavsett vilken gren de tillhör.
Overview screens = Översiktsvyer
Reveal known resources on world screen = Visa kända resurser i världsvyn
In the Resources overview, click on a resource icon to center the world screen on tiles already discovered and providing this resource. = Klicka på en resursikon i resursöversikten för att centrera världsvyn på upptäckta rutor som ger resursen.
Alternatively, click on the "Unimproved" number to center the world screen only on owned (by you or your allied City-states) tiles where the resource is not improved. = Du kan också klicka på antalet ”Oförbättrade” för att endast centrera världsvyn på ägda rutor, dina egna eller allierade stadsstaters, där resursen inte har förbättrats.
If more than one tile is available, click repeatedly on the notification to cycle through all of them. = Om fler än en ruta är tillgänglig kan du klicka upprepade gånger på aviseringen för att växla mellan dem.
Show diagram line colors = Visa diagramlinjernas färger
In Politics overview > Show diagram, you can click anywhere inside the diagram to display a table listing all relationship line colors and their meaning. = I Politiköversikt → Visa diagram kan du klicka var som helst i diagrammet för att visa en tabell över alla färger på relationslinjerna och deras betydelse.
Reading "Toast" popups = Läsa tillfälliga meddelanden
"Toasts" can be clicked to make them stay on the screen for easier reading. = Tillfälliga meddelanden kan klickas så att de stannar kvar på skärmen och blir lättare att läsa.
Click it again to close (or use the close button). = Klicka igen för att stänga meddelandet, eller använd stängningsknappen.
Miscellaneous = Övrigt
External links = Externa länkar
External links support right-click or long press to copy the link to the clipboard instead of launching the browser. = Du kan högerklicka eller hålla externa länkar nedtryckta för att kopiera dem till urklippet i stället för att öppna webbläsaren.
Example: The 'Open Github page' button on the Mod management screen. = Exempel: knappen ”Öppna Github-sidan” i moddhanteringen.
View change log = Visa ändringsloggen
After updating, you might want to see what has changed. The "About" in "Options" has the version number linked to the change log. You can also see that info by clicking the version number on the main menu. = Efter en uppdatering kanske du vill se vad som har ändrats. Under ”Om” i ”Alternativ” är versionsnumret länkat till ändringsloggen. Du kan också se informationen genom att klicka på versionsnumret i huvudmenyn.

Differences from Civilization V = Skillnader mot Civilization V
Production Focus\nIn Civilization V, the Food yield in a city is calculated first, then population grows by consuming stored food (growth), then production is calculated, and so on one by one the other stats are calculated. Thus, citizens can produce yields in the same turn as they are born. The city focus is set to Production to assign the newborn citizen to a hill so they'll contribute Production, and then manually reassigned to a growth tile on the next turn. Alternatively, you can set city focus to Gold (e.g. with Cerro de Potosi), Faith (e.g. with Mount Sinai) or whatever gains the most yields. In Unciv, citizens only start producing yields on the next turn, so you can ignore this whole concept. = Produktionsfokus\nI Civilization V beräknas först stadens matavkastning, sedan växer befolkningen genom att förbruka lagrad mat, därefter beräknas produktionen och sedan övrig statistik en efter en. Invånare kan därför ge avkastning samma drag som de föds. Stadens fokus anges till Produktion för att placera den nyfödda invånaren på en kulle så att den bidrar med produktion, och nästa drag flyttas den manuellt till en tillväxtruta. Alternativt kan fokus anges till Guld, till exempel med Cerro de Potosí, Tro, till exempel med Sinai berg, eller det som ger mest avkastning. I Unciv börjar invånare ge avkastning först nästa drag, så du kan bortse från detta.
Science Queueing\nIn Civilization V, Science yield is calculated after production, so if you finish an item and have Science (or Gold) queued as a perpetual construction, the Production overflow from item will be converted into Science (or Gold), but the Production is not consumed, as this will only happen again on the next turn. By immediately swapping out your perpetual construction for an item on the next turn, you'll get this Science (or Gold) for free. This doesn't apply to Unciv, so don't bother. = Forskningskö\nI Civilization V beräknas vetenskapsavkastningen efter produktionen. Om ett bygge slutförs och Vetenskap eller Guld ligger i kön som ett obegränsat bygge omvandlas överskottsproduktionen till vetenskap eller guld, men produktionen förbrukas inte eftersom detta sker först igen nästa drag. Om du omedelbart byter ut det obegränsade bygget mot ett annat bygge nästa drag får du vetenskapen eller guldet utan kostnad. Detta gäller inte i Unciv.
Double Aqueducts\nIn Civilization V, the game sells existing copies of the building for you before providing a free copy of the building. So, if you build an aqueduct in a city, and then in the turn of adopting Tradition Complete you sell a cheap building (e.g a shrine) beforehand, the game is unable to sell more than 1 building per turn, and thus you'll keep your aqueduct, together with the new free aqueduct. Not applicable to Unciv. = Dubbla akvedukter\nI Civilization V säljer spelet befintliga exemplar av en byggnad innan det ger ett kostnadsfritt exemplar. Om du bygger en akvedukt i en stad och sedan, samma drag som du antar fullständig Tradition, först säljer en billig byggnad, till exempel en helgedom, kan spelet inte sälja fler än en byggnad per drag. Du behåller därför akvedukten och får dessutom den nya kostnadsfria akvedukten. Detta gäller inte i Unciv.
Legalism Oxford\nIn Civilization V, national wonders such as Oxford University are considered culture buildings, so you can get them for free with Legalism. Not applicable to Unciv. = Legalism och Oxford\nI Civilization V betraktas nationella underverk som Oxfords universitet som kulturbyggnader, så de kan erhållas kostnadsfritt genom Legalism. Detta gäller inte i Unciv.
Roads and Forts\nIn Civilization V, you can't use roads and forts in enemy territory. In Unciv, you can use them, so instead of mindlessly constructing them everywhere when at war, you need to decide if and when they'll benefit you more than your opponents. = Vägar och fort\nI Civilization V kan du inte använda vägar och fort på fientligt territorium. I Unciv kan du göra det, så i stället för att tanklöst bygga dem överallt under krig måste du avgöra om och när de gynnar dig mer än dina motståndare.
Citizen Conversion\nIn Civilization V, a citizen is born religious if the parent city is already converted. This is not the case in Unciv, which can lead to temporary deconversion of a city when it grows. = Religiös omvändelse av invånare\nI Civilization V föds en invånare religiös om moderstaden redan har omvänts. Så fungerar det inte i Unciv, vilket tillfälligt kan göra att en stad inte längre är omvänd när den växer.
Unassigned Citizens\nIn Civilization V, unassigned citizens are considered specialists, and subject to the same type of bonuses (e.g. Korea's ability). It can be worthwhile to leave citizens unassigned, instead of being assigned to a tile. Not applicable to Unciv. = Otilldelade invånare\nI Civilization V betraktas otilldelade invånare som specialister och får samma typer av bonusar, till exempel Koreas förmåga. Det kan därför löna sig att lämna invånare otilldelade i stället för att placera dem på en ruta. Detta gäller inte i Unciv.
Settler Construction\nIn Civilization V, cities can't starve when constructing settlers, so you can assign all citizens to production tiles and none to food tiles. In Unciv, citizens keep consuming two food per turn. = Bygga nybyggare\nI Civilization V kan städer inte svälta när de bygger nybyggare, så alla invånare kan placeras på produktionsrutor och inga på matrutor. I Unciv fortsätter invånarna att förbruka två mat per drag.
Water Melee Attack\nAs result of a Discord poll, Water Melee units can attack military land units on the shore, unlike in Civilization V. = Närstridsanfall från vatten\nEfter en omröstning på Discord kan närstridsenheter till sjöss anfalla militära landenheter vid kusten, till skillnad från i Civilization V.
Tile improvements\nIn Civilzation V, workers start working on an improvement-under-construction at the beginning of movement. Unciv changes this, to allow players to assign workers to tiles, and then reconsider and change improvement or move them elsewhere. = Rutförbättringar\nI Civilization V börjar arbetare arbeta på en förbättring under uppförande i början av förflyttningen. Unciv ändrar detta så att spelare kan tilldela arbetare till rutor och därefter tänka om och byta förbättring eller flytta dem någon annanstans.
Forest and Jungle Visibility\nIn Unciv, forests and jungles are visible 1 tile outside visibility range. In Civilization V, this is the behaviour of hills and mountains, but not of forests and jungles, yet jungle and forest can block hills, and hill + forest can block mountain, indicating they're on the same elevation. This is considered to be a bug in the otherwise well-structured visibility logic in Civilization V. = Skogars och djunglers synlighet\nI Unciv syns skogar och djungler en ruta utanför synfältet. I Civilization V gäller detta för kullar och berg men inte för skogar och djungler. Samtidigt kan djungel och skog skymma kullar, och en kulle med skog kan skymma ett berg, vilket tyder på att de ligger på samma höjdnivå. Detta betraktas som ett fel i Civilization V:s i övrigt välstrukturerade synlighetslogik.
City razing\nIn Civilization V, the player can never raze any of the cities he/she founded. Not applicable to Unciv. = Ödelägga städer\nI Civilization V kan spelaren aldrig ödelägga en stad som hen själv har grundat. Detta gäller inte i Unciv.

Founding Cities\nThe Settler is a unit that can found a new city. You can build a Settler unit in a city with at least 2 population, and then move them to a good location to found a new city. This will usually be your main way of acquiring more cities. = Grunda städer\nNybyggaren är en enhet som kan grunda en ny stad. Du kan bygga en nybyggare i en stad med minst två invånare och sedan flytta enheten till en bra plats för att grunda staden. Detta är vanligen ditt främsta sätt att skaffa fler städer.
Food conversion to Production\nDuring the construction of a Settler, the city will not grow. Instead, the 1st, 2nd, 4th, and from there on every 4th, excess Food (Growth) is converted into Production, with the rest of the excess Food being lost. = Omvandla mat till produktion\nNär en nybyggare byggs växer inte staden. I stället omvandlas den första, andra och fjärde enheten av överskottsmat, och därefter var fjärde, till produktion. Resten av överskottsmaten går förlorad.

