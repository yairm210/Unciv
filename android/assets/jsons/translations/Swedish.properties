Hiawatha = Hiawatha
You are a plague upon Mother Earth! Prepare for battle! = Du är en farsot på Moder Jord! Förbered för strid!
You evil creature! My braves will slaughter you! = Ondskefulla varelse! Mina kämpar kommer slakta dig!
You have defeated us... but our spirits will never be vanquished! We shall return! = Du har besegrat oss... men våra andar kommer aldrig kuvas! Vi skall komma åter!
Words alone cannot shake the roots of peace I have planted among my people. = Enbart ord kan inte rubba freden som jag har låtit slå rot bland mitt folk.
Greetings, stranger. I am Hiawatha, speaker for the Iroquois. We seek peace with all, but we do not shrink from war. = Var hälsad, främling, Jag är Hiawatha, talare för Irokeserna. Vi söker fred med alla, men räds inte krig.
Does this trade work for you, my friend? = Fungerar detta förslag med dig, min vän?
The Great Warpath = Den Stora Krigsstigen
Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Your people lived near the great and holy lake Ontario since the ancient ages, on a land that will be later known as New York city. Long ago, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida became one nation, the Haudenosaunee, the Iroquois. Although not having a written language, the wise Iroquois created the Great Law of Peace, which can be considered the first established constitution. For decades, your people fought powerful enemies, such as the Huron, and then the French and English colonists. With less warriors and inferior weaponry, the Iroquois still survived and walk on the path of peace and harmony, until their way of living faded away under the crush of the newborn United States nation. = Var hälsad, ädle Hiawatha, ledare för de mäktiga irokesnationerna! Ditt folk har sedan urminnes tider levt nära den stora och heliga Ontariosjön, i ett land som senare skulle bli känt som New York. För länge sedan förenades de fem folken seneca, onondaga, mohawk, cayuga och oneida till en nation: Haudenosaunee, irokeserna. Trots att de saknade ett skriftspråk skapade de visa irokeserna Den stora fredslagen, som kan betraktas som den första etablerade konstitutionen. I årtionden stred ditt folk mot mäktiga fiender, först huronerna och senare de franska och engelska kolonisterna. Med färre krigare och sämre vapen överlevde irokeserna ändå och vandrade fredens och harmonins väg, tills deras livssätt försvagades under trycket från den nyfödda amerikanska nationen.
Great Sachem Hiawatha, do you hear the complaints of your people? Can you light the path leading to the ancient Iroquois union? Will your new empire shine through the ages of history? = Store sachem Hiawatha, hör du ditt folks klagan? Kan du lysa upp vägen tillbaka till det forna irokesiska förbundet? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
