A sacrifice unlike all others must be made! = Nu krävs ett offer utan dess like!
Muahahahahahaha! = Muahahahahahaha!
Today comes a great searing pain. With you comes the path to the black storm. = Idag kommer en genomträngande smärta. Med dig kommer vägen till det svarta ovädret.
Greetings, wayward one. I am known as Pacal. = Hälsningar, du långväga komne. Jag kallas Pakal.
Friend, I believe I may have found a way to save us all! Look, look and accept my offering! = Min vän, jag tror jag hittat ett sätt att rädda oss alla! Se här, se och ta emot min offergåva!
A fine day, it helps you. = En vacker dag, det hjälper dig.
The Long Count = Långa Räknandet
Kneel before King Pacal the Great, son of the gods and protector of the Palenque domain! After your kingdom has been harassed for years by neighboring rivals, you struck back at the enemies of your people, defeating each of them and sacrificing their leaders as a retribution to the insults made to your ancestors. Your wisdom and hard will not only restored the glory of Palenque, but turned it into a magnificient city, as your people built the greatest monuments and architecture the world has ever known. = Böj er inför kung Pakal den store, gudarnas son och beskyddare av Palenqueriket! Efter att grannriken i åratal hade ansatt ditt land slog du tillbaka mot folkets fiender, besegrade dem en efter en och offrade deras ledare som vedergällning för förolämpningarna mot dina förfäder. Din visdom och fasta vilja återställde inte bara Palenques ära utan förvandlade det också till en storslagen stad, där ditt folk uppförde några av världens främsta monument och byggnadsverk.
Absolute King, your people need you to save the great Mayan culture and knowledge. Will you be able to read the movement of the stars, and find in the heavens the power to repel any foes? Will your new empire shine through the ages of history? = Enväldige kung, ditt folk behöver dig för att rädda mayafolkets stora kultur och kunskap. Kan du läsa stjärnornas rörelser och finna kraften i himlen att slå tillbaka varje fiende? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
