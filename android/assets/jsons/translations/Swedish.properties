Augustus Caesar = Augustus Caesar
My treasury contains little and my soldiers are getting impatient... (sigh) ...therefore you must die. = Min skattkammare är tom och mina soldater börjar bli otåliga... (suck) ...därför måste du dö.
So brave, yet so stupid! If only you had a brain similar to your courage. = Så modig, men ändå så korkad! Om du ändå hade hjärna i proportion till din ryggrad.
The gods have deprived Rome of their favour. We have been defeated. = Gudarna har berövat Rom sin favör. Vi är besegrade.
I wasn't sure, but it seems you do have some grit. = Jag var osäker, men du verkar faktiskt ha ryggrad.
I greet you. I am Augustus, Imperator and Pontifex Maximus of Rome. If you are a friend of Rome, you are welcome. = Jag hälsar dig. Jag är Augustus, Kejsare och Pontifex Maximus av Rom. Om du är en vän till Rom, är du välkommen.
I offer this, for your consideration. = Jag erbjuder detta, att överväga.
Hail. = Hell.
What do you want? = Vad vill du?
The Glory of Rome = Roms Prakt
Ave Caesar Augustus, Emperor of Rome and Dominus of the Roman Empire! Your empire was the most powerful and feared of all in Western civilization. The Roman people crafted so brilliantly its culture, law, art, and warfare, that no one could contest the supremacy of Rome. Force and Honor led to glorious conquests, a domination of all the lands from Spain in the west to Syria in the east, even reaching the remote barbarian lands of England and Germany. Roman art and architecture have been praised for millenia and have been envied by all lesser civilizations who have followed. = Ave Caesar Augustus, Roms kejsare och Romarrikets härskare! Ditt imperium var den västerländska civilisationens mäktigaste och mest fruktade. Det romerska folket utvecklade sin kultur, lagstiftning, konst och krigföring så lysande att ingen kunde bestrida Roms överhöghet. Styrka och ära ledde till storslagna erövringar, från Spanien i väster till Syrien i öster och ända till de avlägsna barbariska trakterna i England och Germanien. Romersk konst och arkitektur har hyllats i årtusenden och avundats av alla mindre civilisationer som följt.
O glorious Imperator, your people celebrate you and ask for the glory of Rome! In these times of darkness, the Pax Romana will be a beacon of light for all! Will your new empire shine through the ages of history? = O ärorike imperator, ditt folk hyllar dig och ber om Roms återvunna ära! I dessa mörka tider ska Pax Romana vara en ljusfyr för alla. Kommer ditt nya rike att lysa genom historiens tidsåldrar?
