The world will be more beautiful without you. Prepare for war. = Världen vore vackrare utan dig. Förbered för krig.
Fool! You will soon regret dearly! I swear it! = Dåre! Du kommer snart ångra dig bittert! Jag svär det!
You have won, congratulations. My palace is now in your possession, and I beg that you care well for the peacock. = Du har vunnit, gratulerar. Mitt palats är nu i din makt, och jag ber dig att ta väl hand om påfågeln.
Our future battle will be glorious. = Vår framtida strid blir ärorik.
Welcome foreigner, I am Harun Al-Rashid, Caliph of the Arabs. Come and tell me about your empire. = Välkommen utlänning, jag är Harun al-Rashid, Arabernas Kalif. Kom och berätta om ditt rike.
Come forth, let's do business. = Kom närmare, låt oss köpslå.
Peace be upon you. = Fred vare med dig.
Trade Caravans = Handelskaravaner
Blessings of the Great God be upon you, O great caliph Harun al-Rashid, leader of the mighty Arabian people! The Muslim Empire, the Caliphate, born from chaos after the death of the prophet Muhammad in 632 AD, intended to apply the rule of God to all Earth. And by the will of God, the caliphate reached its full power, ruling Spain, North Africa, the Middle East, Anatolia, the Balkans and Persia, to even surpass the Great Roman Empire. The arts and sciences were a holy gift of Arabia during the Middle Ages, as the infidel lands of Europe delved deep into ignorance and chaos. Lasting for six hundred years, the Caliphate finally fell before the Mongols, the plague of the civilized world. = Den store Gudens välsignelser vare över dig, o store kalif Harun al-Rashid, ledare för det mäktiga arabiska folket! Det muslimska imperiet, kalifatet, föddes ur kaoset efter profeten Muhammeds död år 632 och ville låta Guds lag råda över hela jorden. Genom Guds vilja nådde kalifatet sin fulla makt och styrde över Spanien, Nordafrika, Mellanöstern, Anatolien, Balkan och Persien och överträffade till och med det stora Romarriket. Under medeltiden var konst och vetenskap en helig gåva från Arabien, medan Europas otrogna länder sjönk ned i okunnighet och kaos. Efter sexhundra år föll kalifatet slutligen för mongolerna, den civiliserade världens gissel.
Great Caliph Harun al Rashid, all Arabian people long for greatness! Arabia must be once again the land of arts and knowledge, which under the radiant law of God, will fear no enemy! Will your new empire shine through the ages of history? = Store kalif Harun al-Rashid, hela det arabiska folket längtar efter storhet! Arabien måste åter bli konstens och kunskapens land, som under Guds strålande lag inte fruktar någon fiende. Kommer ditt nya rike att lysa genom historiens tidsåldrar?
