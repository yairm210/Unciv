Magnificent Empress Theodora, beloved of Byzantium and of Rome, your people salute you! With your beauty and intelligence, you rose up from actress and courtesan to the rank of the most powerful woman in the Roman Empire, as wife of Justinian I. In the late 520's AD, you helped your husband engage in spiritual and legal reforms, promugalting numerous laws to improve women's status and treatment in the empire. You also made of Constantinople the jewel of the Eastern Roman Empire with the restoration and construction of many aqueducts, bridges, and churches, its beauty culminating with the creation of the Hagia Sophia, one of the most splendid pieces of architecture in the world. = Magnifika kejsarinna Theodora, älskad av Bysans och Rom, ditt folk hälsar dig! Med din skönhet och intelligens steg du från skådespelerska och kurtisan till den mäktigaste kvinnan i Romarriket som Justinianus I:s hustru. Under slutet av 520-talet hjälpte du din make att genomföra religiösa och juridiska reformer och utfärdade många lagar som förbättrade kvinnors ställning och behandling i riket. Du gjorde också Konstantinopel till Östromerska rikets juvel genom att restaurera och uppföra akvedukter, broar och kyrkor, med Hagia Sofia som kronan på verket – ett av världens mest praktfulla byggnadsverk.
Beautiful Empress,the Byzantine Empire's magnificence is intact in all memories, and ready to reborn as the new jewel of humankind. Will your new empire shine through the ages of history? = Vackra kejsarinna, det bysantinska rikets prakt lever kvar i allas minne och är redo att återfödas som mänsklighetens nya juvel. Kommer ditt nya rike att lysa genom historiens tidsåldrar?
