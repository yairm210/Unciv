George Washington = George Washington
Your wanton aggression leaves us no choice. Prepare for war! = Din hejdlösa aggression ger oss inget val. Förbered för krig!
You have mistaken our love of peace for weakness. You shall regret this! = Du har misstagit vår kärlek till fred för svaghet. Du kommer ångra detta!
The day...is yours. I hope you will be merciful in your triumph. = Dagen...är din. Jag hoppas du kan visa nåd i din triumf.
The people of the United States of America welcome you. = De Förenta Staternas folk välkomnar dig.
Is the following trade of interest to you? = Är detta erbjudande av intresse för dig?
Well? = Nå?
Manifest Destiny = Det Bestämda Ödet
President Washington, we salute you and the proud American civilization! Freed from the British dominion in the 18th century, then cleansed and reborn after a terrible civil war, the United States nation was ready to play its great role in the 20th century. At the height of its power, triumphant after two terrible world wars, United States of America, a land of immigration, opportunities, optimism and determination, has risen above all other weakening nations, unable to equal such power. = President Washington, vi hälsar dig och den stolta amerikanska civilisationen! Efter att ha befriats från det brittiska herraväldet på 1700-talet och därefter renats och återfötts efter ett fruktansvärt inbördeskrig var Förenta staterna redo att spela sin stora roll under 1900-talet. På höjden av sin makt, segerrikt efter två fasansfulla världskrig, reste sig Amerikas förenta stater – ett land präglat av invandring, möjligheter, optimism och beslutsamhet – över alla andra försvagade nationer som inte kunde mäta sig med dess styrka.
President Washington, will you show to the world the legitimacy of the American way of life, and spread the flame of liberty to all mankind? Will your new empire shine through the ages of history? = President Washington, kommer du att visa världen det amerikanska levnadssättets berättigande och sprida frihetens låga till hela mänskligheten? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
