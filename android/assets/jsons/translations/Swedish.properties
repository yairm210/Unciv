Suleiman I = Süleyman I
Your continued insolence and failure to recognize our preeminence leads us to war. = Din fortsatta fräckhet och vägran att erkänna vår överhöghet leder oss till krig.
Good. The world shall witness the incontestable might of my armies and the glory of the Empire. = Bra. Världen kommer bära vittne till mina arméers oövervinnliga makt och Rikets ära.
Ruin! Ruin! Istanbul becomes Iram of the Pillars, remembered only by the melancholy poets. = Stoft! Aska! Istanbul blir som Pelarnas Iram, ihågkommen endast av de dystraste poeter.
From the magnificence of Topkapi, the Ottoman nation greets you, stranger! I'm Suleiman, Kayser-I Rum, and I bestow upon you my welcome! = Från Topkapis prakt, hälsar den Osmanska nationen dig, främling! Jag är Süleyman, Kejsare av Rum, och jag ger dig mitt välkomnande!
Let us do business! Would you be interested? = Låt oss göra affärer! Vore du intresserad?
Barbary Corsairs = Barbareskkorsarer
O Great Sultan Suleiman, may the God bless you! You are revered for your power, wealth and generosity, and you truly deserves to be called the 'Magnificent'! The Ottoman Empire was born in Bithynia, starting as a small country in Eastern Anatolia in 12th century, then expanded to west into Anatolia. Over the next century, your people vanquished the empire of Byzantium, annexing Turkey and the Balkans, and smartly assimilating all wonders and knowledge of the Byzantine civilization. In the mid 15th century, the Ottomans added Constantinople to their empire, establishing a strategic link between Europe and the Middle East. The Empire would continue to expand for centuries reaching North Africa, Middle East and Eastern Europe at its height, but brutally disappeared in the chaos of the first world war, in early 20th century. = O store sultan Süleyman, må Gud välsigna dig! Du vördas för din makt, rikedom och frikostighet och förtjänar verkligen att kallas ”den store”. Osmanska riket föddes i Bithynien som ett litet land i östra Anatolien på 1100-talet och bredde sedan ut sig västerut. Under det följande århundradet besegrade ditt folk det bysantinska riket, införlivade Turkiet och Balkan och tillgodogjorde sig skickligt den bysantinska civilisationens underverk och kunskap. I mitten av 1400-talet fogade osmanerna Konstantinopel till sitt rike och skapade en strategisk länk mellan Europa och Mellanöstern. Imperiet fortsatte att expandera i århundraden och nådde på sin höjdpunkt Nordafrika, Mellanöstern och Östeuropa, men upplöstes brutalt i första världskrigets kaos i början av 1900-talet.
Mighty Caliph, your people ask you to build again the Empire, to the level of power and glory it once achieved, and beyond! Will you revive the Ottoman golden age? Will your new empire shine through the ages of history? = Store kalif, ditt folk ber dig att åter bygga upp imperiet till den makt och ära det en gång hade – och ännu längre! Kommer du att återuppliva den osmanska guldåldern? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
