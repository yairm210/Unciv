Jip-hyun-jun (Hall of Worthies) will no longer tolerate your irksome behavior. We will liberate the citizens under your oppression even with force, and enlighten them! = Jip-hyun-jun (de Värdigas Sal) kommer inte längre tolerera ditt störande beteende. Vi kommer befria befolkningen under ditt förtryck, rentav med makt, och upplysa dem.
Foolish, miserable wretch! You will be crushed by this country's magnificent scientific power! = Dåraktiga, usla klant! Du kommer krossas av detta lands storslagna vetenskapskraft!
Now the question is who will protect my people. A dark age has come. = Frågan är vem som nu ska beskydda mitt folk. En mörk tid är kommen.
Your words reveal more of your own prejudice than any fault in my own. = Dina ord avslöjar mer om dina egna fördomar än om några fel hos mig.
Welcome to the palace of Choson, stranger. I am the learned King Sejong, who looks after his great people. = Välkommen till Joseons palats, främling. Jag är den lärde Kung Sejong, som ser efter sitt stora folk.
We have many things to discuss and have much to benefit from each other. = Vi har mycket att diskutera och kan gagnas mycket från varandra.
Oh, it's you = Åh, det är du
Scholars of the Jade Hall = Jadesalens Lärda
Greetings to you, King Sejong the Great, heir of the Choson Dynasty! Prosperity and benevolence towards the common man are the principles of your reign, and made of you the most beloved Korean king. You always aimed to provide a fair and equal society for all your people, and also to favor knowledge and technological discoveries. Your wisdom and intelligence imbued all the Korean society, and the scholars of the Jade Hall developed Korea's first written language, Hangul, sharing further literature and science to the people after centuries of darkness. = Var hälsad, kung Sejong den store, arvtagare till Joseondynastin! Välstånd och välvilja mot vanligt folk är grundsatserna för din regering och gjorde dig till Koreas mest älskade kung. Du strävade alltid efter ett rättvist och jämlikt samhälle för hela folket och främjade kunskap och tekniska upptäckter. Din visdom och intelligens genomsyrade hela det koreanska samhället, och lärda i Jadehallen utvecklade Koreas första skriftspråk, hangul, vilket efter århundraden av mörker spred litteratur och vetenskap till folket.
Wise Sejong, will you gift your people with the radiance of harmony and knowledge to dispel the darkness once again? Will your new empire shine through the ages of history? = Vise Sejong, kommer du att skänka ditt folk harmonins och kunskapens ljus för att ännu en gång skingra mörkret? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
