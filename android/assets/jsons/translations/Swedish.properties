I have just received a report that large numbers of my troops have crossed your borders. = Jag har just nåtts av en rapport att mängder av mina trupper har gått över dina gränser.
My attempts to avoid violence have failed. An eye for an eye only makes the world blind. = Mina försök att undvika våld har misslyckats. Öga för öga gör bara världen blind.
You can chain me, you can torture me, you can even destroy this body, but you will never imprison my mind. = Du kan kedja fast mig, du kan tortera mig, du kan till och med förgöra denna kropp, men du kommer aldrig fängsla min ande.
Curious. = Intressant.
Hello, I am Mohandas Gandhi. My people call me Bapu, but please, call me friend. = Hej, jag är Mohandas Gandhi. Mitt folk kallar mig Bapu, men, snälla, kalla mig vän.
My friend, are you interested in this arrangement? = Min vän, är du intresserad av detta arrangemang?
I wish you peace. = Jag önskar dig fred.
Population Growth = Befolkningstillväxt
Wise Mahatma Gandhi, great leader of India, we honor you! India is one of the oldest countries in the world with 10,000 years of history, built on spirit and religion, as three of the world's great religions - Hinduism, Buddhism and Jainism - appeared on this sacred land. Every aspect of India society reveres art, music and color, showing great wealth but also grinding poverty. For centuries, India was torn between local kingdoms fighting each other but also repelling invaders. In the 12th century AD, Muslim Turks tried to conquer India, then the Mongols took their place. In the early 17th century, India, still fragmented, was colonized by the English and their diplomacy and technological superiority. After two centuries of British dominion, Indian nationalism woke up, and you, Great Mahatma, have led a peaceful and victorious rebellion never seen anywhere in history! = Vise Mahatma Gandhi, Indiens store ledare, vi hedrar dig! Indien är ett av världens äldsta länder med 10 000 år av historia, byggd på andlighet och religion. Tre av världens stora religioner – hinduism, buddhism och jainism – uppstod i detta heliga land. Varje del av det indiska samhället vördar konst, musik och färg och uppvisar både stor rikedom och djup fattigdom. I århundraden slets Indien mellan lokala kungadömen som bekämpade varandra och samtidigt avvärjde inkräktare. På 1100-talet försökte muslimska turkar erövra Indien, och senare tog mongolerna deras plats. I början av 1600-talet koloniserades det fortfarande splittrade Indien av engelsmännen med hjälp av deras diplomati och tekniska överlägsenhet. Efter två århundraden av brittiskt herravälde vaknade den indiska nationalismen, och du, store Mahatma, ledde ett fredligt och segerrikt uppror utan motstycke i historien!
Gandhi, your people ask again to be led on the path of freedom. Under protection of Ganesha and Surya, can India accomplish its great potential? Will your new empire shine through the ages of history? = Gandhi, ditt folk ber åter att få ledas på frihetens väg. Kan Indien under Ganeshas och Suryas beskydd förverkliga sin stora potential? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
