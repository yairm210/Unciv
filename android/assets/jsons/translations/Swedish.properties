Resistance is futile! You cannot hope to stand against the mighty Incan empire. If you will not surrender immediately, then prepare for war! = Allt motstånd är förgäves! Du har ingen chans att stå emot det mäktiga Inkariket. Om du inte tänker ge dig omedelbart, förbered för krig!
Declare war on me?!? You can't, because I declare war on you first! = Förklara krig mot mig?!? Glöm det, jag förklarar krig mot dig först!
How did you darken the sun? I ruled with diligence and mercy—see that you do so as well. = Hur har du förmörkat solen? Jag styrde med flit och med nåd - se till att även du gör det.
How are you? You stand before Pachacuti Inca Yupanqui. = Hur mår du? Du står inför Pachakutiq Inka Yupanki.
The Incan people offer this fair trade. = Inkafolket erbjuder dig detta rättvisa förslag.
How are you doing? = Hur mår du?
What do you want now? = Vad vill du nu?
Great Andean Road = Stora Andinska Vägen
King Pachacuti Sapa Inca, maker of the world and ruler of Tawantinsuyu and the Inca people, your loyal subjects greet you! In the beginning, the small state of Cusco already showed the Incans were promised for greatness. They won many wars against powerful enemies, relentlessly crushing any army that dared oppose them, and forged a mighty empire stretching from Ecuador to Chile, the greatest ever seen in pre-Columbian America. Not just undaunted soldiers, Inca people were accomplished builders and artists, their magnificient and unequalled culture still fascinating the world today. = Kung Pachacuti Sapa Inca, världens skapare och härskare över Tawantinsuyu och inkafolket, dina trogna undersåtar hälsar dig! Redan från början visade den lilla staten Cusco att inkafolket var ämnat för storhet. De vann många krig mot mäktiga fiender, krossade skoningslöst varje armé som vågade motsätta sig dem och skapade ett mäktigt rike från Ecuador till Chile, det största som någonsin funnits i det förkolumbianska Amerika. Inkafolket var inte bara orädda soldater utan också framstående byggare och konstnärer, och deras storslagna, oöverträffade kultur fascinerar fortfarande världen.
O Emperor Pachacuti, honor your name of 'Earth Shaker'! Will you once again summon the power of the earth to unite all Incan people under the protection of Sapa Inca, the Son of the Sun? Will your new empire shine through the ages of history? = O kejsar Pachacuti, gör skäl för ditt namn ”jordskakaren”! Kommer du åter att frammana jordens kraft och ena hela inkafolket under Sapa Incas, solens sons, beskydd? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
