Boudicca = Boudicca
You shall stain this land no longer with your vileness! To arms, my countrymen. We ride to war! = Du ska inte befläcka detta land längre med din uselhet! Till vapen, landsmän. Vi rider i krig!
Traitorous man! The Celtic peoples will not stand for such wanton abuse and slander - I shall have your balls! = Svekfulle man! Det Keltiska folket kommer inte längre stå ut med sådant hejdlöst förtal och skymf - dina kulor är mina!
Vile ruler, know you have won this war in name alone. Your cities lie buried and your troops defeated. I have my own victory. = Usle härskare, vet att du endast vunnit detta krig till namnet. Dina städer ligger begravna och dina trupper besegrade. Jag har min egen seger.
Don't forget who you're dealing with. Arrogant moves can get you in danger. = Glöm inte vem du har att göra med. Högmodiga drag kan försätta dig i fara.
I am Boudicca, Queen of the Celts. Let no-one underestimate me! = Ja är Boudicca, kelternas drottning. Låt ingen underskatta mig!
Let us join our forces together and reap the rewards. = Låt oss slå våra krafter samman och skörda framgångarna.
God has given good to you. = Gud har skänkt dig goda gåvor.
Druidic Lore = Druidiska Läror
May glory and honor always be upon you, Warrior Queen! In a time dominated by men, you successfully claimed the throne and the power, but also valiantly defied the mighty Roman Empire. Punished and humiliated by the hand of the Roman bloody invaders, you united your people and led a terrible revolt, to seek revenge. Many legions fell under your fierce attacks and you burned the city of London with your anger. While the Romans still kept ownership of your land after your final defeat, your actions nonetheless showed Rome that this land could never be fully conquered, making Nero himself consider to withdraw all troops and leaving Britain forever. = Må ära och heder alltid följa dig, krigardrottning! I en tid som dominerades av män gjorde du med framgång anspråk på tronen och makten och trotsade dessutom modigt det mäktiga Romarriket. Efter att ha straffats och förödmjukats av de blodtörstiga romerska inkräktarna enade du ditt folk och ledde ett fruktansvärt uppror för att söka hämnd. Många legioner föll för dina våldsamma angrepp och i din vrede brände du staden London. Även om romarna behöll kontrollen över landet efter ditt slutliga nederlag visade dina handlingar att det aldrig helt kunde kuvas, och fick till och med Nero att överväga att dra tillbaka alla trupper och lämna Britannien för alltid.
O raging lioness, will you lead the Celts again under the glory of your name, to spread the fires of liberty, and achieve a final victory? Will your new empire shine through the ages of history? = O rasande lejoninna, kommer du åter att leda kelterna under ditt namns ära, sprida frihetens eldar och vinna den slutliga segern? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
