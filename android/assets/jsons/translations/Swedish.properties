Darius I = Dareios I
Your continue existence is an embarrassment to all leaders everywhere! You must be destroyed! = Din fortsatta existens är en skam för ledare överallt! Du måste förgöras!
Curse you! You are beneath me, son of a donkey driver! I will crush you! = Förbanne dig! Du är nedom mig, du son av en åsneförare! Jag kommer krossa dig!
You mongrel! Cursed be you! The world will long lament your heinous crime! = Din byracka! Förbanne dig! Världen kommer länge sörja över ditt fruktansvärda illdåd!
Peace be on you! I am Darius, the great and outstanding king of kings of great Persia... but I suppose you knew that. = Fred vare med dig! Jag är Dareios, den store och framstående kungarnas kung av det stora Persien... men jag antar att du visste det.
In my endless magnanimity, I am making you this offer. You agree, of course? = I min oändliga givmildhet, ger jag dig detta erbjudande. Du tackar förstås ja?
Good day to you! = God dag till dig!
Ahh... you... = Ahh... du...
Achaemenid Legacy = Akemenidernas Arv
Great King Darius of Persia, the heaven casts its light upon you! Persian people are strong and wise, as their leader. In old ages, the great Persian king Cyrus fought back the mighty Median empire and finally destroyed the Medes in 550 BC. Cunning diplomacy and military achievements helped then to conquer the wealthy Lydia and the powerful Babylon, Cyrus' son conquering the eternal Egypt some years later. At the height of its power, the Persian Empire reached the shores of Macedonia, at the very door of the upstart Greek city-states. Persia would have prospered for centuries if Alexander of Macedon hadn't brutally destroyed the great empire in one violent strike. = Store kung Darius av Persien, himlen låter sitt ljus falla över dig! Det persiska folket är starkt och vist, liksom sin ledare. I forna tider slog den store persiske kungen Kyros tillbaka det mäktiga mediska riket och besegrade slutligen mederna år 550 f.Kr. Skicklig diplomati och militära bedrifter gjorde det sedan möjligt att erövra det rika Lydien och det mäktiga Babylon, och några år senare intog Kyros son det eviga Egypten. På höjden av sin makt nådde Perserriket Makedoniens stränder, alldeles vid porten till de framväxande grekiska stadsstaterna. Persien kunde ha blomstrat i århundraden om inte Alexander av Makedonien brutalt hade förstört det stora riket i ett våldsamt slag.
King Darius, the people of Persia await, longing for its past glory and power! Persia of the Immortals must reborn, to punish its foes and rebuild the gleaming Persepolis! Will your new empire shine through the ages of history? = Kung Darius, Persiens folk väntar och längtar efter sin forna ära och makt! De odödligas Persien måste återfödas, straffa sina fiender och återuppbygga det strålande Persepolis. Kommer ditt nya rike att lysa genom historiens tidsåldrar?
