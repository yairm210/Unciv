I cannot wait until ye grow even mightier. Therefore, prepare for war! = Jag kan inte vänta tills du stärks ytterligare. Därför, förbered dig för krig!
Corrupted villain! We will bring you into the ground! = Korrumperade tölp! Vi kommer lägga dig i jord!
Germany has been destroyed. I weep for the future generations. = Tyskland är förgjort. Jag fäller bittra tårar för de framtida generationerna.
That wild bravado? It's a ticking time bomb, especially when you're all bark and no bite! = Det där vilda övermodet? Det är en tickande bomb, särskilt när du bara skäller men inte biter!
Guten Tag. In the name of the great German people, I bid you welcome. = Guten Tag. I det tyska folkets namn, hälsar jag dig välkommen.
It would be in your best interest, to carefully consider this proposal. = Det vore i ditt bästa intresse, att noga överväga detta erbjudande.
What now? = Vad nu?
So, out with it! = Nå, ut med det!
Furor Teutonicus = Furor Teutonicus
All hail to Otto von Bismarck, first chancellor of Germany and its empire! During the ancient era, Germany was a land fragmented in several tribes but already showed great promise as the Roman Empire itself struggled to bend the Germans to its will. Germany, as one nation, was slowly built on the ruins of the Holy Roman Empire, and waited 1871 to be finally unified after the glorious victory on France and Napoleon III. The German people are creative, intelligent, industrious and proven to be talented warriors through history. Despite great catastrophes and failures in the first half of the 20th century, Germany can always rely on its people will and strength to be among the greatest and powerful nations in the world. = All ära åt Otto von Bismarck, Tysklands och dess imperiums förste rikskansler! Under antiken var Tyskland splittrat i flera stammar men visade redan stor potential när själva Romarriket kämpade för att kuva germanerna. Tyskland som enad nation byggdes långsamt på det tysk-romerska rikets ruiner och blev slutligen förenat 1871 efter den ärorika segern över Frankrike och Napoleon III. Det tyska folket är kreativt, intelligent och arbetsamt och har genom historien visat sig vara skickliga krigare. Trots stora katastrofer och misslyckanden under 1900-talets första hälft kan Tyskland alltid förlita sig på sitt folks vilja och styrka för att höra till världens främsta och mäktigaste nationer.
Great Prince Bismarck, glory and power are at the heart of the German nation. Your people are bright, and lend you their iron will to lead Germany once again. Will your new empire shine through the ages of history? = Store furst Bismarck, ära och makt finns i den tyska nationens hjärta. Ditt folk är begåvat och lånar dig sin järnvilja för att åter leda Tyskland. Kommer ditt nya rike att lysa genom historiens tidsåldrar?
