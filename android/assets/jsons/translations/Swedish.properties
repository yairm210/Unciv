Greetings to the wise and brave Prince William of Orange, who freed the Netherlands and gave strength to the Dutch people. In 1568, you led a rebellion against Spanish dominion, to gain freedom for your people, and therefore starting the Eighty Years' War. Your actions were all aimed to create one of Europe's first modern republics, the Seven United Provinces. The rebellion was the meaning of your very life and death, as it was also the cause of your assassination in 1584. But your death has given even more pride and courage to your people, to fight for liberty against any oppressors. Carved in history as the 'Father of the Fatherland', your name is a symbol of Dutch independence for eternity. = Var hälsad, vise och modige prins Vilhelm av Oranien, som befriade Nederländerna och gav det nederländska folket styrka. År 1568 ledde du ett uppror mot det spanska herraväldet för att vinna frihet åt ditt folk och inledde därmed det åttioåriga kriget. Alla dina handlingar syftade till att skapa en av Europas första moderna republiker, De sju förenade provinserna. Upproret blev meningen med både ditt liv och din död, eftersom det också ledde till mordet på dig år 1584. Men din död gav ditt folk ännu större stolthet och mod att kämpa för frihet mot alla förtryckare. Som ”fosterlandets fader” är ditt namn för evigt en symbol för nederländsk självständighet.
Brave Prince, your people ask for your wisdom to gain its freedom once more, and to illuminate the world with progressive and modern ideas. Will your new empire shine through the ages of history? = Modige prins, ditt folk ber om din visdom för att återvinna sin frihet och upplysa världen med progressiva och moderna idéer. Kommer ditt nya rike att lysa genom historiens tidsåldrar?
