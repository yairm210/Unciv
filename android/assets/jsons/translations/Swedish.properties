Isabella = Isabella
God will probably forgive you... but I shall not. Prepare for war. = Gud kommer förmodligen förlåta dig... men inte jag. Förbered dig för krig.
Repugnant spawn of the devil! You will pay! = Motbjudande djävulens avkomma! Du ska få betala!
If my defeat is, without any doubt, the will of God, then I will accept it. = Om mitt nederlag, utan tvekan, är Guds vilja, så kommer jag godta det.
God blesses those who deserve it. I am Isabel of Spain. = Gud välsignar dem som förtjänar det. Jag är Isabella av Spanien.
I hope this deal will receive your blessing. = Jag hoppas detta förslag möter din välsignelse.
Seven Cities of Gold = De Sju Städerna av Guld
Holy Isabella, envoy of God, Great Queen of Castille and León, your people celebrate you! Spain is a beautiful and ancient country, a link between Europe and Africa, one shore on the Mediterranean and the other on the mighty Atlantic Ocean. The Spanish culture had taken the best of the Christian and Muslim worlds, and was ready to dominate the world for centuries. Powerful Spanish military fleets and brave explorers found and conquered much of the New World. Exploiting a whole new continent and its riches, Spain reached a state of power few could compete with for hundreds of years. = Heliga Isabella, Guds sändebud och stora drottning av Kastilien och León, ditt folk hyllar dig! Spanien är ett vackert och uråldrigt land, en länk mellan Europa och Afrika, med en kust mot Medelhavet och en annan mot det mäktiga Atlanten. Den spanska kulturen hade tillgodogjort sig det bästa från den kristna och muslimska världen och var redo att dominera världen i århundraden. Mäktiga spanska flottor och modiga upptäcktsresande fann och erövrade stora delar av Nya världen. Genom att exploatera en hel kontinent och dess rikedomar nådde Spanien en maktställning som få kunde mäta sig med under flera hundra år.
O splendid and virtuous Isabella! By the will of the heavens, will Spain reborn to achieve its holy destiny and become a new El Dorado? Will your new empire shine through the ages of history? = O strålande och dygdiga Isabella! Kommer Spanien genom himlens vilja att återfödas, uppfylla sitt heliga öde och bli ett nytt El Dorado? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
