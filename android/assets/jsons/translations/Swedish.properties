Ramkhamhaeng = Ramk'amheng
You lowly, arrogant fool! I will make you regret of your insolence! = Låga, arroganta dåre! Jag kommer få dig att ångra din fräckhet!
You scoundrel! I shall prepare to fend you off! = Knöl! Jag kommer göra mig redo att jaga undan dig!
Although I lost, my honor shall endure. I wish you good luck. = Fast jag förlorade, ska min heder bestå. Jag önskar dig lycka till.
I, Pho Kun Ramkhamhaeng, King of Siam, consider it a great honor that you have walked to visit my country of Siam. = Jag, Pho Khun Ramk'amheng, Kung av Siam, ser det som en stor ära att du har gått för att besöka mitt rike Siam.
Greetings. I believe this is a fair proposal for both parties. What do you think? = Hälsningar. Jag tror att det här är ett rättvist förslag för båda parter. Vad tycker du?
Welcome. = Välkommen.
Father Governs Children = Fader Styr Barn
O Great King Ramkhamhaeng, the Siamese people obey you with respect and fear! The beautiful and mysterious land of Siam is an ancient country in the heart of Southeast Asia, which was besieged by many foes, plagued by bloody war and great poverty, but eventually the smart and loyal Siamese people have endured and triumphed. Siam was a part of the Khmer Empire until the 13th century AD, before its brave people took arms and led a revolution to form the small Sukhothai kingdom. After many battles and diplomacy prowess, this tiny kingdom became a mighty empire, which would dominate South East Asia for more than a century. = O store kung Ramkhamhaeng, det siamesiska folket lyder dig med respekt och fruktan! Det vackra och gåtfulla Siam är ett uråldrigt land i Sydostasiens hjärta. Det belägrades av många fiender och plågades av blodiga krig och stor fattigdom, men det kloka och lojala siamesiska folket uthärdade och segrade. Siam var en del av Khmerriket fram till 1200-talet, då dess modiga folk tog till vapen och gjorde uppror för att grunda det lilla kungadömet Sukhothai. Genom många strider och skicklig diplomati blev detta lilla rike ett mäktigt imperium som skulle dominera Sydostasien i mer än ett århundrade.
Wise and powerful King Ramkhamhaeng, your people want to revive these days of glory! Can you make a new dawn break on Siam? Will your new empire shine through the ages of history? = Vise och mäktige kung Ramkhamhaeng, ditt folk vill återuppleva dessa ärorika dagar! Kan du låta en ny gryning bryta fram över Siam? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
