#################### Lines from Events from Civ V - Gods & Kings ####################

Tutorial Task: [Move unit] = Övningsuppgift: [Move unit]
Move a unit! = Flytta en enhet!
Click on a unit → Click on a destination → Click the arrow popup. = Klicka på en enhet → Klicka på ett mål → Klicka på pilen som visas.

Found a city! = Grunda en stad!
Select the Settler → Click on 'Found city'. = Välj nybyggaren → Klicka på ”Grunda stad”.

Enter the city screen! = Öppna stadsvyn!
Click the city button twice. = Klicka två gånger på stadsknappen.

Pick a technology to research! = Välj en teknologi att forska fram!
Click on the tech button → Select technology → Click 'Research' (bottom right). = Klicka på teknikknappen → Välj teknologi → Klicka på ”Forska” (nere till höger).

Pick a construction! = Välj ett bygge!
Enter city screen → Click on a unit or building → Click 'add to queue'. = Öppna stadsvyn → Klicka på en enhet eller byggnad → Klicka på ”Lägg till i kön”.

Pass a turn! = Avsluta ett drag!
Cycle through units with 'Next unit' → Click 'Next turn'. = Växla mellan enheterna med ”Nästa enhet” → Klicka på ”Nästa drag”.

Reassign worked tiles! = Ändra vilka rutor som bearbetas!
Enter city screen → Click the assigned tile to unassign → Click an unassigned tile to assign population. = Öppna stadsvyn → Klicka på den tilldelade rutan för att frigöra den → Klicka på en otilldelad ruta för att tilldela befolkning.

Got it = Jag förstår
Meet another civilization! = Möt en annan civilisation!
Explore the map until you encounter another civilization! = Utforska kartan tills du stöter på en annan civilisation!

Open the options dialog! = Öppna alternativdialogrutan!
Click the menu button (top left) → Click 'Options'. = Klicka på menyknappen (uppe till vänster) → Klicka på ”Alternativ”.

Construct an improvement! = Bygg en förbättring!
Construct a Worker unit → Move it to a Plains or Grassland tile → Click 'Construct improvement' → Choose the farm → Leave the worker there until it's finished. = Bygg en arbetarenhet → Flytta den till en slätt- eller gräslandsruta → Klicka på ”Bygg förbättring” → Välj gården → Lämna arbetaren där tills arbetet är färdigt.

Create a trade route! = Skapa en handelsväg!
Construct roads between your capital and another city. Or, automate your worker and let him get to that eventually. = Bygg vägar mellan huvudstaden och en annan stad. Du kan också automatisera arbetaren och låta den göra det så småningom.

Conquer a city! = Erövra en stad!
Bring an enemy city down to low health → Enter the city with a melee unit. = Sänk en fiendestads hälsa till en låg nivå → Gå in i staden med en närstridsenhet.

Move an air unit! = Flytta en luftenhet!
Select an air unit → Select another city within range → Move the unit to the other city. = Välj en luftenhet → Välj en annan stad inom räckvidd → Flytta enheten till den andra staden.

See your stats breakdown! = Visa en detaljerad statistiköversikt!
Enter the Overview screen (top right corner) → Click on 'Stats'. = Öppna översiktsvyn (övre högra hörnet) → Klicka på ”Statistik”.


