Scourge of God = Guds Gissel
Great Attila, mighty warrior and leader of the Hunnic empire, your men bow down before you. During the 5th century, you and your brother Bleda have conquered many lands, forged a mighty empire and commanded the most powerful and frightening force of antiquity. You inspired fear to the Roman Emperors themselves, who called you 'Flagellum Dei', the 'Scourge of God', as you took kingdom after kingdom in the Balkans, invaded Eastern Roman Empire, into Gaul and Northern Italy, and planned to conquer Rome itself. Your empire didn't survive long after your death, but your name and your legend have, for millenia to come. = Store Attila, mäktige krigare och ledare för hunnernas rike, dina män böjer sig inför dig. Under 400-talet erövrade du och din bror Bleda många länder, skapade ett mäktigt rike och förde befäl över antikens starkaste och mest skräckinjagande här. Du väckte fruktan hos de romerska kejsarna själva, som kallade dig ”Flagellum Dei”, Guds gissel, när du intog kungadöme efter kungadöme på Balkan, invaderade Östromerska riket, Gallien och norra Italien och planerade att erövra själva Rom. Ditt rike överlevde inte länge efter din död, men ditt namn och din legend består i årtusenden.
Fearsome General, your mighty hordes are at your command, waiting to crush your foes once again and to conquer all the riches the world has to offer! Will your new empire shine through the ages of history? = Fruktade general, dina mäktiga horder står under ditt befäl och väntar på att åter krossa dina fiender och erövra världens alla rikedomar! Kommer ditt nya rike att lysa genom historiens tidsåldrar?
