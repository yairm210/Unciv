Oda Nobunaga = Oda Nobunaga
I hereby inform you of our intention to wipe out your civilization from this world. = Härmed informerar jag dig om vår avsikt att utrota din civilisation från denna värld.
Pitiful fool! Now we shall destroy you! = Ömkansvärda dåre! Nu kommer vi förgöra dig!
You were much wiser than I thought. = Du var visare än jag trodde.
I expected more for you from. = Jag väntade mig mer av dig.
We hope for a fair and just relationship with you, who are renowned for military bravery. = Vi hoppas på ett rättvist och rättrådigt förhållande med dig, som är berömd för militärt mod.
I would be grateful if you agreed on the following proposal. = Jag vore tacksam om du gick med på följande förslag.
Oh, it's you... = Åh, det är du...
Bushido = Bushido
Lord Oda Nobunaga, ruler of Japan, the land of the Rising Sun is at your command! Through history, Japanese people lived and died with honor, proud of their rich culture of arts and letters. Years of bloody civil wars, invasions of foreign powers, wealth but also great poverty, have never altered the strong will of the Rising Sun island, as the Bushido spirit has imbued the fields of battle and the Japanese society for millenia. At the end of the 19th century, under foreign influence, your people took the path of modernity, and in a few decades, made of Japan a land of technological innovation and powerful industry, with which only few nations can compete. = Furste Oda Nobunaga, Japans härskare, den uppgående solens land står under ditt befäl! Genom historien har det japanska folket levt och dött med heder, stolt över sin rika konst- och litteraturkultur. År av blodiga inbördeskrig, invasioner av främmande makter, välstånd men också stor fattigdom har aldrig brutit örikets starka vilja, eftersom bushidons anda har genomsyrat både slagfälten och det japanska samhället i årtusenden. Under slutet av 1800-talet valde ditt folk, under utländskt inflytande, modernitetens väg och gjorde på några årtionden Japan till ett land av teknisk innovation och mäktig industri som få nationer kan mäta sig med.
O great daimyo, will you take on your hands the Japan destiny, for the Rising Sun to light the world? Will your new empire shine through the ages of history? = O store daimyo, kommer du att ta Japans öde i dina händer och låta den uppgående solen lysa över världen? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
