Askia = Askia
You are an abomination to heaven and earth, the chief of ignorant savages! You must be destroyed! = Du är himlens och jordens avskum, alla okunniga vildars hövding! Du måste förgöras!
Fool! You have doomed your people to fire and destruction! = Dåre! Du har dömt ditt folk till eld och förstörelse!
We have been consumed by the fires of hatred and rage. Enjoy your victory in this world - you shall pay a heavy price in the next! = Vi har slukats upp av hatens och vredens lågor. Njut av din seger i denna värld - du kommer få betala ett tungt pris i nästa!
This insult shall cost you. = Den här förolämpningen ska stå dig dyrt.
I am Askia of the Songhai. We are a fair people - but those who cross us will find only destruction. You would do well to avoid repeating the mistakes others have made in the past. = Jag är Askia av Songhairiket. Vi är ett rättvist folk - men de som står i vår väg möter enbart förstörelse. Bäst vore om du undviker att upprepa de misstag andra tidigare gjort.
Can I interest you in this deal? = Kan jag intressera dig i detta förslag.
River Warlord = Flodkrigsherre
Askia, leader of the Songhai people and greatest of all, may God watch your path towards glory! Songhai was under the rule of the mighty West African state of Mali until the middle of the 14th century. Great King Sunni Ali Ber fought for independance, and showed to all Songhai's power, by conquering territories and repelling many foes who sought to destroy the rising kingdom. Ultimately, conquest of the wealthy cities of Timbuktu and Jenne made Songhai an empire with enough economic power to survive for a century, until the empire bowed down before foes with advanced technology - muskets against spearmen. = Askia, Songhaifolkets ledare och den störste av alla, må Gud vaka över din väg mot äran! Songhai stod under den mäktiga västafrikanska staten Malis styre fram till mitten av 1300-talet. Den store kungen Sonni Ali Ber kämpade för självständighet och visade Songhais makt för alla genom att erövra territorier och slå tillbaka många fiender som ville förstöra det växande riket. Erövringen av de rika städerna Timbuktu och Djenné gjorde slutligen Songhai till ett imperium med tillräcklig ekonomisk styrka för att bestå i ett århundrade, tills det föll för fiender med överlägsen teknik – musköter mot spjut.
King Askia, your people know there's still hope, that the hour of revenge is coming. Give them wealth and power, give them mighty weapons of iron and fire, to destroy any foe, for Songhai to revive! Will your new empire shine through the ages of history? = Kung Askia, ditt folk vet att hoppet lever och att hämndens timme närmar sig. Ge dem rikedom och makt, ge dem mäktiga vapen av järn och eld för att förgöra varje fiende och återuppliva Songhai! Kommer ditt nya rike att lysa genom historiens tidsåldrar?
