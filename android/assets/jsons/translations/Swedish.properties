Kamehameha I = Kamehameha I
The ancient fire flashing across the sky is what proclaimed that this day would come, though I had foolishly hoped for a different outcome. = Den uråldriga elden som svepte över skyn förutspådde att denna dag skulle komma, även om jag dåraktigt hade hoppats på ett annat utfall.
It is obvious now that I misjudged you and your true intentions. = Det är nu uppenbart att jag felbedömde dig och dina avsikter.
The hard-shelled crab yields, and the lion lies down to sleep. Kanaloa comes for me now. = Den hårdskalade krabben ger sig, och lejonet lägger sig att sova. Kanaloa kommer för mig nu.
The ocean's tide may rise and fall, but my resolve stands steady. = Havets tidvatten må stiga och sjunka, men min beslutsamhet står fast.
Aloha! Greetings and blessings upon you, friend. I am Kamehameha, Great King of this strand of islands. = Aloha! Hälsningar och välsignelser över dig, vän. Jag är Kamehameha, Storkung över denna ökedja.
Come, let our people feast together! = Kom, låt våra folk festa tillsammans!
Welcome, friend! = Välkommen, vän!
Wayfinding = Havsresande
Aloha to Kamehameha the Great, who the heavens allowed to unite your people! O great King, under your reign, the Big Island of Hawai'i became one in 1791 AD, and many other islands joined your vision of union in 1810. As the first King of Hawai'i, law and taxation systems were stabilized, and you promoted the Kanawai Mamalahoe, an edict to protect civilian people in times of war. Unification and sovereignty of all the islands continued thanks to your fair laws and deeds, even after you joined your ancestors in paradise in 1819. = Aloha till Kamehameha den store, som himlen lät ena sitt folk! O store kung, under din regering förenades Hawaiis stora ö år 1791 och många andra öar anslöt sig till din vision om enhet år 1810. Som Hawaiis första kung stabiliserade du lag- och skattesystemen och utfärdade Kanawai Mamalahoe, ett påbud som skyddade civilbefolkningen i krigstid. Dina rättvisa lagar och handlingar bevarade öarnas enhet och suveränitet även efter att du förenades med dina förfäder i paradiset år 1819.
Wise and benevolent King, will you unite your people once again by wearing the bright mantle of the Lion of the Pacific? Will your new empire shine through the ages of history? = Vise och välvillige kung, kommer du åter att ena ditt folk genom att bära Stillahavslejonets strålande mantel? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
