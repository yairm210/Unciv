Haile Selassie = Haile Selassie
I have tried all other avenues, but yet you persist in this madness. I hope, for your sake, your end is swift. = Jag har provat alla andra vägar, men du envisas i denna galenskap. Jag hoppas för din skull att ditt slut blir kort.
It is silence that allows evil to triumph. We will not stand mute and allow you to continue on this mad quest unchecked. = Det är tystnad som låter ondskan segra. Vi kommer inte stå stumma och låta dig fortsätta på detta vansinniga företag obehindrat.
God and history will remember your actions this day. I hope you are ready for your impending judgment. = Gud och historien kommer minnas dina handlingar denna dag. Jag hoppas du är redo för din kommande dom.
What a waste of time. = Vilket slöseri med tid.
A thousand welcomes to our fair nation. I am Selassie, the Ras Tafari Makonnen and Emperor of Ethiopia, your humble servant. = Tusen välkomnanden till vår vackra nation. Jag är Selassie, Ras Tafari Makonnen och Etiopiens Kejsare, din ödmjuke tjänare.
I request that you consider this offer between our two peoples. I believe it will do us both good. = Jag ber dig att överväga detta erbjudande mellan våra två folk. Jag tror det kommer göra oss båda gott.
Spirit of Adwa = Adwas Anda
May God bless you, wise and righteous Emperor of Ethiopia, Haile Selassie. As one of Ethiopia's greatest rulers and a spiritual leader of the Rastafarian movement, your good influence on diplomacy and political cooperation are praised throughout the world. You created Ethiopia's first written constitution, and favorized democracy for years to come, your great wisdom making Ethiopia enter as a charter member in the United Nations. Always aiming to reform and modernize your nation, you changed Ethiopian destiny for the best. = Må Gud välsigna dig, vise och rättfärdige kejsare av Etiopien, Haile Selassie. Som en av Etiopiens främsta härskare och en andlig ledare för rastafarirörelsen hyllas ditt goda inflytande på diplomati och politiskt samarbete världen över. Du skapade Etiopiens första skrivna författning och främjade demokrati för kommande generationer. Din stora visdom gjorde Etiopien till en av Förenta nationernas ursprungliga medlemsstater. Med ständig strävan efter att reformera och modernisera ditt land förändrade du Etiopiens öde till det bättre.
Revered King, your knowledge and intelligence are required once again to protect your people from many threats in the world. Will you secure peace and stability, with benevolence and authority, in the radiance of the Kebra Nagast? Will your new empire shine through the ages of history? = Vördade kung, din kunskap och intelligens behövs åter för att skydda folket mot världens många hot. Kommer du med välvilja och auktoritet att trygga fred och stabilitet i Kebra Nagasts strålglans? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
