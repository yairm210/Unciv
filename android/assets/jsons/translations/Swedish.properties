Genghis Khan = Djingis Khan
You stand in the way of my armies. Let us solve this like warriors! = Du står i vägen för mina arméer. Låt oss lösa detta som krigare!
No more words. Today, Mongolia charges toward your defeat. = Inga fler ord. Idag, rider Mongoliet mot ditt nederlag.
You have hobbled the Mongolian clans. My respect for you nearly matches the loathing. I am waiting for my execution. = Du har stympat de mongoliska klanerna. Min respekt för dig motsvarar nästan mitt hat. Jag väntar på min avrättning.
Your bravery must be commended. = Ditt mod förtjänar beröm.
I am Temuujin, conqueror of cities and countries. Before me lie future Mongolian lands. Behind me is the only cavalry that matters. = Jag är Temüdjin, städers och länders erövrare. Framför mig ligger framtida mongoliska länder. Bakom mig är det enda kavalleriet som spelar roll.
I am not always this generous, but we hope you take this rare opportunity we give you. = Jag är inte alltid så här givmild, men vi hoppas du tar den här sällsynta chansen vi ger dig.
So what now? = Vad nu då?
Mongol Terror = Mongolisk Terror
O great Temuujin, immortal leader of the mighty Mongol Empire! Your name alone was enough to make cities crumble, and the sound of the mighty Mongol cavalry to make your enemies flee! O Great Khan! Once Northern Asia united into a mighty people, producing one of the greatest armies the world has ever known, your skillful mounted archers conquered in only a few years, most of China, Eastern Asia, and even reached the gates of Europe at the West. With cunning diplomacy and brilliant warfare, you swept your enemies one after another, creating the greatest empire ever seen, reducing Roman or Greek conquests to minor achievements. = O store Temüdjin, odödlig ledare för det mäktiga Mongolriket! Enbart ditt namn fick städer att rämna och ljudet av det mäktiga mongoliska kavalleriet fick fienderna att fly. O store khan! När norra Asien hade förenats till ett mäktigt folk och frambringat en av de största arméer världen skådat, erövrade dina skickliga beridna bågskyttar på bara några år större delen av Kina och Östasien och nådde till och med Europas portar i väster. Med listig diplomati och lysande krigföring svepte du undan fiende efter fiende och skapade det största rike som dittills skådats, så att romerska och grekiska erövringar framstod som mindre bedrifter.
Divine Temuujin, battles and conquests run through the veins of the Mongols. Are you ready to shatter the will of your enemies? Will your cavalry ride in the steppes once again and strike as lightning and thunder? Will your new empire shine through the ages of history? = Gudomlige Temüdjin, strid och erövring flyter i mongolernas ådror. Är du redo att krossa dina fienders vilja? Kommer ditt kavalleri åter att rida över stäpperna och slå ned som blixt och åska? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
