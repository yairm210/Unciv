All hail Great King Gustavus Adolphus, founder of the Swedish Empire, and one of the most famous military tacticians. In the early 17th century, Sweden emerged as a great power in Europe under your reign, thanks to your wisdom, both in diplomacy and warfare. As king, you decided to reform Swedish laws to bring economic stability and prosperity to your people. Your allies, and also your enemies, called you the 'Lion of the North', witnessing your modern vision of warfare, and the prowess of your armies on the battlefield. As you triumphed in the Thirty Years' War, your name will be forever remembered as one of history's greatest generals. = All ära åt den store kung Gustav II Adolf, det svenska stormaktsväldets grundare och en av historiens mest berömda militärstrateger. Under början av 1600-talet växte Sverige under din regering till en europeisk stormakt tack vare din klokhet inom både diplomati och krigföring. Som kung reformerade du svensk lagstiftning för att ge folket ekonomisk stabilitet och välstånd. Både allierade och fiender kallade dig ”Lejonet från Norden” och bevittnade din moderna syn på krigföring och dina arméers skicklighet på slagfältet. Genom dina segrar i trettioåriga kriget kommer ditt namn för alltid att räknas bland historiens främsta fältherrar.
O noble King, will you lend your leadership and brilliant ideas to Sweden once again, to conceive strategies never seen before? Will your new empire shine through the ages of history? = O ädle kung, kommer du åter att skänka Sverige ditt ledarskap och dina lysande idéer och utforma strategier som aldrig tidigare skådats? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
