Harald Bluetooth = Harald Blåtand
If I am to be honest, I tire of those pointless charades. Why don't we settle our disputes on the field of battle, like true men? Perhaps the skalds will sing of your valor... or mine! = Om jag ska vara ärlig, så börjar jag tröttna på den här meningslösa charaden. Vad sägs om att vi avgör våra tvister på slagfältet, som riktiga män? Kanske skalderna kommer besjunga ditt mannamod...
Ahahah! You seem to show some skills of a true Viking! Too bad that I'll probably kill you! = Ahaha! Du verkar kunna bli en äkta viking! Tyvärr kommer jag förmodligen döda dig!
Loki must have stood by you, for a common man alone could not have defeated me... Oh well! I will join the einherjar in Valhalla and feast, while you toil away here. = Loke måste ha hjälpt dig, för en vanlig människa kunde inte ha besegrat mig ensam... Nåväl! Jag kommer festa hos einherjarna i Valhall, medan du fortsätter slita här.
Our future battle will be glorious! = Vår framtida strid blir ärorik!
Harald Bluetooth bids you welcome to his lands, a Viking unlike any the seas and lands have ever known! Hah, are you afraid? = Harald Blåtand hälsar dig välkommen till sitt rike, en Viking som varken hav eller land sett dess like! Ha, är du rädd?
This is a fine deal! Even a drunk beggar would agree! = En utmärkt uppgörelse! Till och med en supen tiggare skulle hålla med!
Hail to you. = Hell dig.
Viking Fury = Vikingavrede
Skal, Harald Bluetooth Gormsson, son of King Gorm of the Old and Thyra Dannebod! After crushing the armies of Norway, you achieved great construction projects all across the land of mighty Denmark. Numerous Ring Fortresses were built under your reign to protect the people from foreign invasions, but also from local quarrels. In 983 AD, you successfully repelled several waves of German settlers trying to colonize your land, and then always kept your kingdom free from any foreign pressure. = Skål, Harald Blåtand Gormsson, son till kung Gorm den gamle och Thyra Danebod! Efter att ha krossat Norges arméer genomförde du stora byggnadsprojekt i hela det mäktiga Danmark. Många ringborgar uppfördes under din regering för att skydda folket mot både främmande invasioner och inhemska strider. År 983 slog du framgångsrikt tillbaka flera vågor av tyska nybyggare som försökte kolonisera ditt land och höll därefter alltid riket fritt från utländskt tryck.
As a true Viking, who knows not fear, time has come to unleash mighty armies of Northsmen to bring despair upon your enemies! By the will of the Gods, it will be either a glorious triumph or a sumptuous feast in the Valhalla! Will your new empire shine through the ages of history? = Som en sann viking som inte känner fruktan har tiden kommit att släppa lös nordbornas mäktiga arméer och sprida förtvivlan bland dina fiender! Genom gudarnas vilja väntar antingen en ärorik triumf eller en storslagen fest i Valhall. Kommer ditt nya rike att lysa genom historiens tidsåldrar?
