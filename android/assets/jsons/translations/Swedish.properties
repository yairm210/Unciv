Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (Die, die, die!) = Xi-miqa-can! Xi-miqa-can! Xi-miqa-can! (Dö, dö, dö!)
Excellent! Let the blood flow in raging torrents! = Utmärkt! Låt blodet flyta i strida forsar!
Monster! Who are you to destroy my greatness? = Monster! Vem är du att förstöra min storhet?
What do I see before me? Another beating heart for my sacrificial fire. = Vad är detta jag ser framför mig? Ännu ett levande hjärta till min offereld.
Accept this agreement or suffer the consequences. = Gå med på detta erbjudande eller lid följderna.
Welcome, friend. = Välkommen, vän.
Sacrificial Captives = Offerfångar
O divine Montezuma, your people welcome you! May your magnificence inspire all living things! The mighty Aztecs were nomads until the 12th century, when they choose to settle in the mesa central, which would later be called Mexico. Wars were frequent with other tribes to control the rich land surrounding the sacred lakes of Texcoco, Xaltocan and Zampango. In some 200 years, double-sided alliances and martial prowess made of the Aztecs the dominant power in the Central American basin, forming a mighty empire stretching from sea to sea. Alas, the empire fell under the assault of foreign devils - the Spaniards and many curses they brought with them! Wars between tribes and weaponry of doom used by the invaders made the great Aztec civilization crumble in only a few decades. = O gudomlige Montezuma, ditt folk välkomnar dig! Må din prakt inspirera allt levande! De mäktiga aztekerna var nomader fram till 1100-talet, då de valde att slå sig ned på högplatån som senare skulle kallas Mexiko. Krig var vanliga med andra stammar om kontrollen över det rika landet kring de heliga sjöarna Texcoco, Xaltocan och Zumpango. På omkring tvåhundra år gjorde växlande allianser och militär skicklighet aztekerna till den dominerande makten i Centralamerika, med ett mäktigt imperium från hav till hav. Ack, riket föll för främmande demoner – spanjorerna och de många förbannelser de förde med sig! Krig mellan stammar och inkräktarnas förödande vapen fick den stora aztekiska civilisationen att falla sönder på bara några årtionden.
O mighty King Montezuma, do you hear the call of your people seeking for revenge? Will you lead them to victory under the light of the Five Suns? Will your new empire shine through the ages of history? = O mäktige kung Montezuma, hör du ditt folks rop efter hämnd? Kommer du att leda dem till seger under de fem solarnas ljus? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
