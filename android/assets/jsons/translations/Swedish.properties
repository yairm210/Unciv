Noble and pious Queen Maria Theresa, Holy Roman Empress and sovereign of Austria, the people revere your grace. After the death of your father King Charles VI, you inherited the throne of Austria during difficult economic and military times. But you used your wisdom and unflinching determination to fend off your foes and resolve any obstacles to stability and prosperity. With your husband Francis Stephen at your side as co-ruler, you assured your place as Empress of the Holy Roman Empire. During your reign, you reformed Austria in several domains, as you gifted it with a powerful army, a stable economic model, and an improved educational system. = Ädla och fromma drottning Maria Teresia, tysk-romersk kejsarinna och Österrikes härskarinna, folket vördar din nåd. Efter din far kung Karl VI:s död ärvde du Österrikes tron under svåra ekonomiska och militära förhållanden. Men med visdom och orubblig beslutsamhet slog du tillbaka dina fiender och övervann hindren för stabilitet och välstånd. Med din make Frans Stefan vid din sida som medregent säkrade du din ställning som kejsarinna av det tysk-romerska riket. Under din regering reformerade du Österrike på flera områden och gav landet en mäktig armé, en stabil ekonomisk modell och ett förbättrat utbildningssystem.
O Great Queen, proud and dignified, by the will of God and the Divine right, can you reach the height of prosperity and splendor the kingdom of Austria deserves? Will your new empire shine through the ages of history? = O stora, stolta och värdiga drottning, kan du genom Guds vilja och den gudomliga rätten nå det välstånd och den prakt som kungariket Österrike förtjänar? Kommer ditt nya rike att lysa genom historiens tidsåldrar?
